<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>AVL Site Survey</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AVL Survey">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e2e5ea;
  --accent:#2563eb; --accent-soft:#eff4ff;
  --ok:#0f7b4f; --ok-bg:#e7f5ee; --warn:#b45309; --warn-bg:#fdf3e3; --na:#6b7280; --na-bg:#eef0f3;
  --danger:#b42318;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --card:#171a21; --ink:#e8eaee; --muted:#9aa1ad; --line:#2a2f3a;
    --accent:#5b8cff; --accent-soft:#1b2436;
    --ok:#4ade80; --ok-bg:#12291d; --warn:#fbbf24; --warn-bg:#2c2210; --na:#9aa1ad; --na-bg:#20242c;
    --danger:#f87171;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:96px;
}
.wrap{max-width:820px;margin:0 auto;padding:0 12px}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:50; background:var(--card);
  border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);
}
.hd{display:flex;align-items:center;gap:10px;padding:10px 12px;max-width:820px;margin:0 auto}
.hd h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em;flex:1}
.hd .sub{display:block;font-size:11px;color:var(--muted);font-weight:400}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;max-width:820px;margin:0 auto 8px;width:calc(100% - 24px)}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.corechip{font-size:11px;padding:4px 8px;border-radius:99px;background:var(--na-bg);color:var(--muted);white-space:nowrap}
.corechip.done{background:var(--ok-bg);color:var(--ok)}

/* ---------- cards / sections ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:12px 0;overflow:hidden;scroll-margin-top:88px}
.sec{scroll-margin-top:88px}
.sec{border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sechd{
  display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none;
  background:none;border:0;width:100%;text-align:left;color:inherit;font:inherit
}
.sechd:active{background:var(--accent-soft)}
.sechd .t{flex:1;font-weight:600;font-size:15px}
.sechd .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.sechd .car{transition:transform .18s;color:var(--muted);font-size:12px}
.sec.open .sechd .car{transform:rotate(90deg)}
.secbody{display:none;padding:2px 14px 16px}
.sec.open .secbody{display:block}
.sec.skipped .sechd .t{opacity:.45;text-decoration:line-through}
.sec.skipped .secbody{display:none}

/* ---------- fields ---------- */
.f{margin:12px 0}
.f>label,.flab{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.flab .core{color:var(--accent);font-size:15px;line-height:1;vertical-align:middle}
.hint{font-size:12px;color:var(--muted);font-weight:400;margin-top:4px;display:block}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:16px
}
textarea{min-height:66px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.f{flex:1;min-width:96px;margin:0}
.row+.row{margin-top:12px}

/* tri-state */
.tri{display:flex;gap:6px}
.tri button{
  flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer
}
.tri button[aria-pressed=true][data-v=ok]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.tri button[aria-pressed=true][data-v=issue]{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.tri button[aria-pressed=true][data-v=na]{background:var(--na-bg);color:var(--na);border-color:var(--na)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{
  padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:99px;font:inherit;font-size:13px;cursor:pointer
}
.chips button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}

/* buttons */
button.btn{
  padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer
}
button.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.ghost{color:var(--muted)}
button.btn.sm{padding:7px 10px;font-size:13px}
button.btn:active{transform:translateY(1px)}

/* photos */
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ph{position:relative;width:76px;height:76px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{
  position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:99px;border:0;
  background:rgba(0,0,0,.62);color:#fff;font-size:13px;line-height:1;cursor:pointer;padding:0
}
.addph{
  width:76px;height:76px;border:1.5px dashed var(--line);border-radius:9px;background:none;
  color:var(--muted);font-size:11px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px
}
.addph span:first-child{font-size:19px}

/* computed panel */
.calc{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:12px;margin:14px 0}
.calc h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.calc .big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.calc .lbl{font-size:12px;color:var(--muted)}
.calc .grid{display:flex;gap:18px;flex-wrap:wrap}
.flag{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:600}
.flag.bad{background:var(--na-bg);color:var(--danger)}

/* lux scale */
.lux{display:grid;grid-template-columns:1fr;gap:6px}
.lux button{
  display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:1px solid var(--line);
  background:var(--card);border-radius:10px;font:inherit;cursor:pointer;color:var(--ink)
}
.lux button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.lux .sw{width:26px;height:26px;border-radius:7px;flex:none;border:1px solid rgba(0,0,0,.12)}
.lux .nm{flex:1;font-size:14px;font-weight:600}
.lux .vl{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* rooms */
.roomhd{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.roomhd .nm{flex:1;font-weight:700;font-size:16px}
.roomhd .pct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.roomtools{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg)}

/* footer bar */
.foot{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
  border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom))
}
.foot .in{max-width:820px;margin:0 auto;display:flex;gap:8px}
.foot .in button{flex:1}

.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:14px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:99;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center
}
.toast.on{opacity:.95}
.sysnotices{
  position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:80;
  width:calc(100% - 16px);max-width:804px;display:flex;flex-direction:column;gap:8px;
  pointer-events:none
}
.sysnotice{
  background:var(--ink);color:var(--bg);padding:11px 13px;border-radius:12px;
  font-size:13px;line-height:1.35;display:flex;gap:8px;align-items:center;
  box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:auto
}
.sysnotice .msg{flex:1}
.sysnotice button{
  background:none;border:1px solid currentColor;color:inherit;border-radius:8px;
  padding:5px 9px;font:inherit;font-size:12px;cursor:pointer;flex:none
}
.sysnotice button.pri{background:var(--bg);color:var(--ink)}
.sysnotice button:disabled{opacity:.6;cursor:default}
.skipbtn{font-size:11px;padding:4px 8px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:11px}

/* print */
#print{display:none}
@media print{
  body{background:#fff;color:#000;padding:0;font-size:11pt}
  header,.foot,#app,.toast,.sysnotices{display:none !important}
  #print{display:block;padding:0 10mm}
  #print h1{font-size:17pt;margin:0 0 2mm}
  #print h2{font-size:13pt;margin:6mm 0 2mm;border-bottom:1.5px solid #000;padding-bottom:1mm;page-break-after:avoid}
  #print h3{font-size:11pt;margin:4mm 0 1mm;color:#333;page-break-after:avoid}
  #print table{width:100%;border-collapse:collapse;margin-bottom:3mm;page-break-inside:auto}
  #print td{border-bottom:.5pt solid #bbb;padding:1.4mm 1mm;vertical-align:top;font-size:9.5pt}
  #print td.k{width:42%;color:#444}
  #print td.v{font-weight:600}
  #print .rm{page-break-before:always}
  #print .pg{display:flex;flex-wrap:wrap;gap:2mm;margin-bottom:3mm}
  #print .pg img{width:44mm;height:33mm;object-fit:cover;border:.5pt solid #999}
  #print .cal{border:1pt solid #000;padding:2mm;margin:2mm 0;font-size:10pt}
  #print .meta{font-size:9pt;color:#555;margin-bottom:4mm}
}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div style="flex:1">
      <h1>AVL Site Survey <span class="sub" id="hdsub">Pre-install walkthrough</span></h1>
    </div>
    <span class="corechip" id="corechip">core 0/0</span>
  </div>
  <div class="bar"><i id="bar"></i></div>
</header>

<div class="wrap" id="app"></div>

<div class="foot"><div class="in">
  <button class="btn" id="addroom">+ Room</button>
  <button class="btn" id="save">Export data</button>
  <button class="btn pri" id="pdf">PDF</button>
</div></div>

<div class="toast" id="toast"></div>
<div class="sysnotices" id="systemNotices" aria-live="polite"></div>
<div id="print"></div>
<input type="file" id="filein" accept="image/*" capture="environment" multiple hidden>
<input type="file" id="jsonin" accept="application/json,.json" hidden>

<script>
"use strict";

/* ============================================================
   STORAGE — localStorage with in-memory fallback so the app
   never hard-fails in a restricted preview environment.
   ============================================================ */
var mem = {};
var store = {
  get: function(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } },
  set: function(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ mem[k]=v; return false; } }
};
var KEY = "avl_survey_v1";
var STORAGE_OK = (function(){
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
  catch(e){ return false; }
})();

/* ============================================================
   SCHEMA
   t: text|num|date|time|area|sel|tri|chips
   c: 1 = core field (the stuff we must not leave site without)
   ============================================================ */
var VISIT = [
  {k:"client",  l:"Client / organisation", t:"text", c:1},
  {k:"site",    l:"Site address",          t:"text", c:1},
  {k:"date",    l:"Date",                  t:"date", c:1},
  {k:"surveyor",l:"Surveyor",              t:"text"},
  {k:"contact", l:"Site contact (name / role / mobile)", t:"text", c:1},
  {k:"itc",     l:"IT contact", t:"text", h:"Separate person 90% of the time. Get them now."},
  {k:"scope",   l:"Scope as understood on arrival", t:"area", h:"Note anything that doesn't match the sales scope."}
];

var LOGISTICS = [
  {k:"access",  l:"Delivery / dock access OK", t:"tri"},
  {k:"elev",    l:"Elevator size & weight limit", t:"text", h:"The number that kills LED wall deliveries."},
  {k:"hours",   l:"Work hours / noise restrictions", t:"text"},
  {k:"badge",   l:"Badging or escort required", t:"tri"},
  {k:"storage", l:"Secure on-site storage available", t:"tri"},
  {k:"lognote", l:"Logistics notes", t:"area"}
];

var ROOM_SECTIONS = [
  { id:"id", title:"Room", fields:[
    {k:"name", l:"Room name / number", t:"text", c:1},
    {k:"type", l:"Room type", t:"sel", o:["","Huddle","Conference","Boardroom","Training","Classroom","Auditorium","Sanctuary / worship","Multipurpose","Lobby / digital signage","Control room","Other"], c:1},
    {k:"seats",l:"Seats / occupancy", t:"num"},
    {k:"use",  l:"Primary use case", t:"area", h:"What actually happens in here. Two lines is plenty."}
  ]},

  { id:"dims", title:"Dimensions & structure", fields:[
    {k:"len",  l:"Length (ft)", t:"num", c:1, inline:1},
    {k:"wid",  l:"Width (ft)",  t:"num", c:1, inline:1},
    {k:"hgt",  l:"Ceiling (ft)",t:"num", c:1, inline:1},
    {k:"ceil", l:"Ceiling type", t:"sel", o:["","Hard lid / drywall","ACT grid","Open plenum","Exposed structure","Other"]},
    {k:"wall", l:"Wall construction", t:"chips", o:["Drywall","CMU / block","Glass","Movable partition","Wood / panel","Concrete"]},
    {k:"back", l:"Backing / blocking present at display wall", t:"tri", c:1},
    {k:"obst", l:"Obstructions", t:"area", h:"Columns, beams, soffits, sprinklers, diffusers."}
  ]},

  { id:"light", title:"Ambient light", special:"light", fields:[] },

  { id:"disp", title:"Display & sightlines", fields:[
    {k:"near", l:"Closest seat (ft)", t:"num", inline:1},
    {k:"far",  l:"Furthest seat (ft)", t:"num", c:1, inline:1},
    {k:"viewtype", l:"Viewing task", t:"sel", o:["General viewing","Analytical / detailed content"], h:"Analytical = spreadsheets, CAD, small text. Drives a bigger screen."},
    {k:"propdiag", l:"Proposed display diagonal (in)", t:"num", h:"Leave blank to see the recommended minimum."},
    {k:"mounth", l:"Mount height / position", t:"text"},
    {k:"sight", l:"Sightlines clear", t:"tri"},
    {k:"exdisp", l:"Existing display — reuse or remove", t:"text"}
  ]},

  { id:"audio", title:"Audio", fields:[
    {k:"noise", l:"Ambient noise (dBA)", t:"num", h:"Phone SPL app is fine. Under 45 good, over 55 is a problem."},
    {k:"hvac",  l:"HVAC noise acceptable", t:"tri"},
    {k:"reverb",l:"Reverb / hard surfaces acceptable", t:"tri"},
    {k:"mics",  l:"Mic plan", t:"chips", o:["Ceiling array","Table boundary","Gooseneck","Wireless handheld","Lavalier","Podium","None"]},
    {k:"spk",   l:"Speaker placement constraints", t:"area"}
  ]},

  { id:"power", title:"Power", fields:[
    {k:"outlets", l:"Existing outlets adequate", t:"tri", c:1},
    {k:"panel",   l:"Panel location / spare breakers", t:"text"},
    {k:"dedic",   l:"Dedicated circuit required", t:"tri"},
    {k:"powby",   l:"Power provided by", t:"sel", o:["","EC / by others","Us","TBD"]}
  ]},

  { id:"net", title:"Network & IT", fields:[
    {k:"drops",  l:"Data drops present", t:"tri", c:1},
    {k:"dropn",  l:"Drop count", t:"num", inline:1},
    {k:"cat",    l:"Cable category", t:"sel", o:["","Cat5e","Cat6","Cat6a","Unknown"], inline:1},
    {k:"switch", l:"Switch location / PoE budget", t:"text"},
    {k:"vlan",   l:"VLAN / IP plan", t:"text", h:"Static or DHCP? Who issues addresses?"},
    {k:"fw",     l:"Internet / firewall access for cloud devices", t:"tri"},
    {k:"uc",     l:"UC platform", t:"sel", o:["","Microsoft Teams","Zoom","Webex","Google Meet","Multiple / BYOD","None"], c:1}
  ]},

  { id:"path", title:"Pathways & rack", fields:[
    {k:"conduit", l:"Conduit / pathway present", t:"tri", c:1},
    {k:"pathtype",l:"Pathway type", t:"chips", o:["Conduit","Cable tray","J-hooks","Open plenum","Floor box","Surface raceway"]},
    {k:"runft",   l:"Longest cable run, rack → display (ft)", t:"num", c:1, h:"Measured, not eyeballed. Drives the extender spec."},
    {k:"core",    l:"Core drill / firestop required", t:"tri"},
    {k:"rackloc", l:"Rack / head-end location", t:"text", c:1},
    {k:"rackru",  l:"Available RU", t:"num", inline:1},
    {k:"rackvent",l:"Rack ventilation adequate", t:"tri", inline:1}
  ]},

  { id:"exist", title:"Existing equipment & control", fields:[
    {k:"inv",   l:"Existing gear inventory", t:"area", h:"Make / model / condition. Photograph the labels."},
    {k:"reuse", l:"Anything being reused", t:"tri"},
    {k:"remov", l:"Removal & disposal by", t:"text"},
    {k:"ctrl",  l:"Control interface preference", t:"chips", o:["Touch panel","Button panel","Auto-sensing","App / BYOD","Existing system"]},
    {k:"lightctl", l:"Lighting control integration", t:"sel", o:["","Not required","DALI","DMX","0-10V","Lutron","Crestron","Other / unknown"]},
    {k:"oper",  l:"Who operates the room", t:"sel", o:["","Trained AV staff","General staff","Public / unattended"]}
  ]},

  { id:"notes", title:"Notes & red flags", fields:[
    {k:"flags", l:"Red flags — scope, cost or schedule impact", t:"area", h:"The stuff that ruins the quote if we forget it."},
    {k:"open",  l:"Open questions for client", t:"area"},
    {k:"gen",   l:"General notes", t:"area"}
  ]}
];

/* ============================================================
   LIGHT MODULE DATA
   ============================================================ */
var LUX_PRESETS = [
  {v:30,   n:"Dark / theatrical",        d:"Blackout, no daylight",              c:"#20242c"},
  {v:100,  n:"Dim, controlled",          d:"Lights low, shades closed",          c:"#4a5160"},
  {v:300,  n:"Typical office lighting",  d:"Standard overheads, no daylight",    c:"#98a1b0"},
  {v:700,  n:"Bright, some daylight",    d:"Windows contributing",               c:"#d4dae3"},
  {v:1500, n:"Direct daylight / glass",  d:"Glass wall or skylight, no shades",  c:"#f3f6fa"}
];

/* Recommended direct-view display brightness for a given ambient lux */
function recNits(lux){
  if(lux <= 100)  return 350;
  if(lux <= 300)  return 500;
  if(lux <= 600)  return 700;
  if(lux <= 1000) return 1000;
  return 1500;
}
/* Target screen luminance (footLamberts) for projection at a given ambient lux */
function targetFL(lux){
  if(lux <= 50)  return 16;
  if(lux <= 150) return 25;
  if(lux <= 300) return 35;
  return 50;
}
/* 16:9 geometry from diagonal (inches) */
function wh169(diag){ return { w: diag*0.87157, h: diag*0.49029 }; }
function areaSqFt(diag){ var g = wh169(diag); return (g.w*g.h)/144; }

/* Projector lumens = fL x area(sqft) / gain, x1.4 headroom for lamp ageing & losses */
function recLumens(lux, diag, gain){
  if(!diag || diag <= 0) return null;
  gain = gain || 1.0;
  return Math.round(targetFL(lux) * areaSqFt(diag) / gain * 1.4);
}
/* DISCAS-style max viewing distance (ft) for a 16:9 diagonal */
function maxViewFt(diag, analytical){
  var h = wh169(diag).h;                 // image height, inches
  return (h * (analytical ? 4 : 6)) / 12;
}
/* Minimum diagonal (in) needed for a furthest-seat distance */
function minDiag(farFt, analytical){
  if(!farFt || farFt <= 0) return null;
  var hNeeded = (farFt*12) / (analytical ? 4 : 6);
  return Math.ceil(hNeeded / 0.49029);
}

/* ============================================================
   STATE
   ============================================================ */
var S = { visit:{}, log:{}, rooms:[], photos:{}, skipped:{}, ui:{} };
var seq = 1;

function load(){
  var raw = store.get(KEY);
  if(!raw) return;
  try {
    var d = JSON.parse(raw);
    S = { visit:d.visit||{}, log:d.log||{}, rooms:d.rooms||[], photos:d.photos||{}, skipped:d.skipped||{}, ui:d.ui||{} };
    S.rooms.forEach(function(r){ if(r.id >= seq) seq = r.id + 1; });
  } catch(e){ /* corrupt payload — start clean rather than explode */ }
}
var saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    var ok = store.set(KEY, JSON.stringify(S));
    if(!ok) toast("Storage full — export your data");
  }, 250);
}

function toast(m){
  var t = document.getElementById("toast");
  t.textContent = m; t.classList.add("on");
  setTimeout(function(){ t.classList.remove("on"); }, 2600);
}

/* Two-tap confirm. confirm() is blocked in sandboxed previews and silently
   returns false, which makes buttons look broken. This always works. */
function armConfirm(btn, label, fn){
  if(btn.getAttribute("data-armed") === "1"){
    btn.removeAttribute("data-armed");
    fn();
    return;
  }
  var old = btn.textContent;
  btn.setAttribute("data-armed","1");
  btn.textContent = label;
  btn.style.color = "var(--danger)";
  setTimeout(function(){
    if(btn.parentNode){
      btn.removeAttribute("data-armed");
      btn.textContent = old;
      btn.style.color = "";
    }
  }, 3500);
}

/* Escape hatch when downloads are blocked by the viewer */
function showRaw(text, title){
  var w = document.createElement("div");
  w.style.cssText = "position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;padding:12px;gap:8px";
  var h = document.createElement("div");
  h.style.cssText = "display:flex;gap:8px;align-items:center";
  h.innerHTML = '<b style="flex:1;font-size:14px">' + esc(title || "Raw data") + '</b>';
  var close = document.createElement("button");
  close.className = "btn sm"; close.textContent = "Close";
  close.onclick = function(){ document.body.removeChild(w); };
  var copy = document.createElement("button");
  copy.className = "btn sm pri"; copy.textContent = "Select all";
  var ta = document.createElement("textarea");
  ta.style.cssText = "flex:1;font-family:ui-monospace,Menlo,monospace;font-size:11px";
  ta.value = text;
  copy.onclick = function(){ ta.focus(); ta.select(); try{ document.execCommand("copy"); toast("Copied"); }catch(e){ toast("Selected — copy manually"); } };
  h.appendChild(copy); h.appendChild(close);
  w.appendChild(h); w.appendChild(ta);
  document.body.appendChild(w);
}

/* ============================================================
   VALUE ACCESS
   scope = "visit" | "log" | room id (number)
   ============================================================ */
function bag(scope){
  if(scope === "visit") return S.visit;
  if(scope === "log")   return S.log;
  var r = S.rooms.filter(function(x){ return String(x.id) === String(scope); })[0];
  return r ? r.d : {};
}
function getV(scope,k){ var b = bag(scope); return b[k]; }
function setV(scope,k,v){ bag(scope)[k] = v; save(); }

function answered(v){
  if(v === undefined || v === null) return false;
  if(Array.isArray(v)) return v.length > 0;
  return String(v).trim() !== "";
}

/* ============================================================
   FIELD RENDERING
   ============================================================ */
function esc(s){
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function fieldHTML(scope, f){
  var v = getV(scope, f.k);
  var id = "f_" + scope + "_" + f.k;
  var lab = '<span class="flab"><label for="'+id+'">'+esc(f.l)+
            (f.c ? ' <span class="core" title="Core field">&bull;</span>' : '')+'</label></span>';
  var hint = f.h ? '<span class="hint">'+esc(f.h)+'</span>' : '';
  var da = 'data-scope="'+esc(scope)+'" data-k="'+esc(f.k)+'"';
  var body = "";

  if(f.t === "text" || f.t === "num" || f.t === "date" || f.t === "time"){
    var type = f.t === "num" ? "number" : (f.t === "text" ? "text" : f.t);
    var extra = f.t === "num" ? ' inputmode="decimal" step="any"' : "";
    body = '<input id="'+id+'" type="'+type+'" '+da+extra+' value="'+esc(v)+'">';
  }
  else if(f.t === "area"){
    body = '<textarea id="'+id+'" '+da+'>'+esc(v)+'</textarea>';
  }
  else if(f.t === "sel"){
    body = '<select id="'+id+'" '+da+'>' + f.o.map(function(o){
      return '<option value="'+esc(o)+'"'+(String(v||"") === o ? " selected" : "")+'>'+
             (o === "" ? "—" : esc(o))+'</option>';
    }).join("") + '</select>';
  }
  else if(f.t === "tri"){
    body = '<div class="tri" '+da+'>' +
      [["ok","OK"],["issue","Issue"],["na","N/A"]].map(function(p){
        return '<button type="button" data-tri data-v="'+p[0]+'" aria-pressed="'+(v === p[0])+'">'+p[1]+'</button>';
      }).join("") + '</div>' +
      '<div style="margin-top:6px;'+(v === "issue" ? "" : "display:none")+'" data-issuenote>' +
        '<input type="text" placeholder="What\'s the issue?" data-scope="'+esc(scope)+'" data-k="'+esc(f.k)+'_note" value="'+esc(getV(scope,f.k+"_note"))+'">' +
      '</div>';
  }
  else if(f.t === "chips"){
    var arr = Array.isArray(v) ? v : [];
    body = '<div class="chips" '+da+'>' + f.o.map(function(o){
      return '<button type="button" data-chip data-v="'+esc(o)+'" aria-pressed="'+(arr.indexOf(o) > -1)+'">'+esc(o)+'</button>';
    }).join("") + '</div>';
  }

  return '<div class="f'+(f.inline ? " inl" : "")+'">'+lab+body+hint+'</div>';
}

function fieldsHTML(scope, fields){
  var out = "", buf = [];
  function flush(){
    if(!buf.length) return;
    out += '<div class="row">' + buf.join("") + '</div>';
    buf = [];
  }
  fields.forEach(function(f){
    if(f.inline){ buf.push(fieldHTML(scope,f)); }
    else { flush(); out += fieldHTML(scope,f); }
  });
  flush();
  return out;
}

/* ---------- photo strip ---------- */
function photosHTML(key){

  return '<div class="f"><span class="flab">Photos</span><div class="photos" data-photos="'+esc(key)+'">' +
    list.map(function(p,i){
      return '<div class="ph"><img src="'+p+'" alt=""><button type="button" data-delph="'+i+'">&times;</button></div>';

/* ============================================================
   AMBIENT LIGHT MODULE
   ============================================================ */
function lightHTML(scope){
  var d = bag(scope);
  var meas = [num(d.lux_disp), num(d.lux_mid), num(d.lux_rear)].filter(function(x){ return x !== null; });
  var worst = meas.length ? Math.max.apply(null, meas) : (num(d.lux_preset) || null);
  var isProj = d.disptype === "Projection";

  var h = "";
  h += fieldsHTML(scope, [
    {k:"lt_time", l:"Time of day", t:"time", inline:1},
    {k:"lt_sky",  l:"Sky", t:"sel", o:["","Sunny","Partly cloudy","Overcast","Dark / night"], inline:1}
  ]);
  h += fieldsHTML(scope, [
    {k:"lt_shade", l:"Window treatment", t:"sel", o:["","None fitted","Fitted — open","Fitted — closed","Partial / sheer"]},
    {k:"lt_src",   l:"Light sources present", t:"chips", o:["Overhead LED/fluorescent","Downlights","North-facing glass","South/E/W-facing glass","Skylight","Accent / decorative","Stage lighting"]}
  ]);

  h += '<div class="f"><span class="flab">Measured lux <span class="core">&bull;</span></span>' +
       '<span class="hint" style="margin:0 0 8px">Meter or phone app, held at the surface, facing the light. Take all three if you can.</span></div>';
  h += fieldsHTML(scope, [
    {k:"lux_disp", l:"At display wall", t:"num", inline:1},
    {k:"lux_mid",  l:"Mid seating", t:"num", inline:1},
    {k:"lux_rear", l:"Rear / window wall", t:"num", inline:1}
  ]);

  h += '<div class="f"><span class="flab">No meter? Pick the closest match</span><div class="lux" data-scope="'+esc(scope)+'" data-k="lux_preset">' +
    LUX_PRESETS.map(function(p){
      return '<button type="button" data-luxp data-v="'+p.v+'" aria-pressed="'+(String(d.lux_preset) === String(p.v))+'">' +
             '<span class="sw" style="background:'+p.c+'"></span>' +
             '<span class="nm">'+p.n+'<span class="hint" style="font-weight:400;margin:0">'+p.d+'</span></span>' +
             '<span class="vl">~'+p.v+' lx</span></button>';
    }).join("") + '</div></div>';

  h += fieldsHTML(scope, [
    {k:"disptype", l:"Intended display type", t:"sel", o:["","Direct-view (LCD / LED)","Projection"]},
    {k:"scr_diag", l:"Diagonal (in)", t:"num", inline:1},
    {k:"scr_gain", l:"Screen gain", t:"num", inline:1, h:"Projection only. 1.0 if unknown."}
  ]);

  /* ---- computed panel ---- */
  h += '<div class="calc" data-calc="'+esc(scope)+'">' + calcHTML(scope) + '</div>';
  h += photosHTML(scope + "|light");
  return h;
}

function num(x){
  if(x === undefined || x === null || String(x).trim() === "") return null;
  var n = parseFloat(x);
  return isNaN(n) ? null : n;
}

function calcHTML(scope){
  var d = bag(scope);
  var atDisp = num(d.lux_disp), mid = num(d.lux_mid), rear = num(d.lux_rear);
  var meas = [atDisp, mid, rear].filter(function(x){ return x !== null; });

  /* Washout is driven by illuminance falling on the display surface.
     Prefer the display-wall reading; fall back to the highest measured, then the preset. */
  var basis, basisLabel;
  if(atDisp !== null){ basis = atDisp; basisLabel = "at display wall"; }
  else if(meas.length){ basis = Math.max.apply(null, meas); basisLabel = "highest measured"; }
  else { basis = num(d.lux_preset); basisLabel = "estimated"; }

  if(basis === null){
    return '<h4>Brightness requirement</h4><span class="lbl">Enter a lux reading or pick a preset above.</span>';
  }
  var worst = basis;
  var isProj = d.disptype === "Projection";
  var diag = num(d.scr_diag);
  var gain = num(d.scr_gain) || 1.0;
  var out = '<h4>Brightness requirement &mdash; ' + Math.round(worst) + ' lux ' + basisLabel + '</h4><div class="grid">';

  if(isProj){
    var lum = recLumens(worst, diag, gain);
    out += '<div><div class="big">' + targetFL(worst) + ' fL</div><div class="lbl">target screen luminance</div></div>';
    out += '<div><div class="big">' + (lum ? lum.toLocaleString() : "—") + '</div><div class="lbl">ANSI lumens min' + (lum ? "" : " (enter diagonal)") + '</div></div>';
    out += '</div>';
    if(worst > 300) out += '<div class="flag bad">' + Math.round(worst) + ' lux is too bright for projection. Specify direct-view LED or get shading committed in writing.</div>';
    else if(lum) out += '<div class="flag" style="background:transparent;color:var(--muted);font-weight:400;padding:8px 0 0">Includes 1.4&times; headroom for lamp ageing and optical loss, at ' + gain + ' gain.</div>';
  } else {
    out += '<div><div class="big">' + recNits(worst) + ' nits</div><div class="lbl">minimum panel brightness</div></div>';
    if(diag){
      out += '<div><div class="big">' + diag + '&Prime;</div><div class="lbl">specified diagonal</div></div>';
    }
    out += '</div>';
    if(worst > 1000) out += '<div class="flag bad">Over 1000 lux. Standard commercial panels will wash out — high-brightness display or shading required.</div>';
    else if(worst > 600) out += '<div class="flag">Bright room. Confirm the panel is rated 700 nits or better.</div>';
  }

  /* daylight migration: a much brighter rear/window reading means the display-wall
     figure will not hold all day, and glare hits the seats before it hits the screen */
  var others = [mid, rear].filter(function(x){ return x !== null; });
  if(atDisp !== null && others.length){
    var hi = Math.max.apply(null, others);
    if(hi > atDisp * 1.8 && hi - atDisp > 150){
      out += '<div class="flag">Room reads up to ' + Math.round(hi) + ' lux elsewhere. Daylight will move across the day — note shading and re-check at the worst hour.</div>';
    }
  }

  /* sightline sizing check pulls from the display section */
  var far = num(d.far);
  var analytical = d.viewtype === "Analytical / detailed content";
  if(far){
    var need = minDiag(far, analytical);
    out += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--accent)">';
    out += '<h4 style="margin-bottom:6px">Sizing check &mdash; furthest seat ' + far + ' ft</h4>';
    out += '<div class="grid"><div><div class="big">' + need + '&Prime;</div><div class="lbl">minimum diagonal (' + (analytical ? "analytical" : "general") + ')</div></div>';
    if(diag){
      var can = maxViewFt(diag, analytical);
      out += '<div><div class="big">' + can.toFixed(1) + ' ft</div><div class="lbl">' + diag + '&Prime; is good to</div></div>';
    }
    out += '</div>';
    if(diag && diag < need) out += '<div class="flag">' + diag + '&Prime; is undersized for this room. Step up to ' + need + '&Prime; or larger.</div>';
    out += '</div>';
  }
  return out;
}

function refreshCalc(scope){
  var el = document.querySelector('[data-calc="' + CSS.escape(String(scope)) + '"]');
  if(el) el.innerHTML = calcHTML(scope);
}

/* ============================================================
   PROGRESS
   ============================================================ */
function allFieldsFor(scope){
  if(scope === "visit") return VISIT;
  if(scope === "log")   return LOGISTICS;
  var out = [];
  ROOM_SECTIONS.forEach(function(s){
    if(S.skipped[scope + "|" + s.id]) return;
    if(s.special === "light"){
      out.push({k:"lux_disp", c:1});
      out.push({k:"lt_shade"});
      out.push({k:"disptype"});
    } else {
      out = out.concat(s.fields);
    }
  });
  return out;
}
function progress(scope){
  var f = allFieldsFor(scope), done = 0, core = 0, coreDone = 0;
  f.forEach(function(x){
    var a = answered(getV(scope, x.k));
    if(a) done++;
    if(x.c){ core++; if(a) coreDone++; }
  });
  return { total:f.length, done:done, core:core, coreDone:coreDone };
}
function updateProgress(){
  var t = 0, d = 0, c = 0, cd = 0;
  ["visit","log"].concat(S.rooms.map(function(r){ return r.id; })).forEach(function(sc){
    var p = progress(sc);
    t += p.total; d += p.done; c += p.core; cd += p.coreDone;
  });
  document.getElementById("bar").style.width = (t ? (d/t*100) : 0) + "%";
  var chip = document.getElementById("corechip");
  chip.textContent = "core " + cd + "/" + c;
  chip.className = "corechip" + (c > 0 && cd === c ? " done" : "");
  document.getElementById("hdsub").textContent =
    S.rooms.length ? (S.rooms.length + (S.rooms.length === 1 ? " room" : " rooms") + " &middot; " + d + " fields captured").replace("&middot;","·")
                   : "Pre-install walkthrough";
  S.rooms.forEach(function(r){
    var el = document.querySelector('[data-pct="' + r.id + '"]');
    if(el){ var p = progress(r.id); el.textContent = p.coreDone + "/" + p.core + " core"; }
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function secHTML(scope, id, title, inner, skippable){
  var key = scope + "|" + id;
  var open = S.ui[key] !== false && S.ui[key] !== undefined ? S.ui[key] : false;
  var skipped = !!S.skipped[key];
  return '<div class="sec' + (open ? " open" : "") + (skipped ? " skipped" : "") + '" data-sec="' + esc(key) + '">' +
    '<button class="sechd" type="button" data-toggle="' + esc(key) + '">' +
      '<span class="car">&#9656;</span><span class="t">' + esc(title) + '</span>' +
      (skippable ? '<span class="skipbtn" data-skip="' + esc(key) + '">' + (skipped ? "include" : "skip") + '</span>' : "") +
    '</button>' +
    '<div class="secbody">' + inner + '</div></div>';
}

function render(){
  var h = "";

  /* visit + logistics */
  h += '<div class="card">' +
    secHTML("visit","main","Visit details", fieldsHTML("visit", VISIT), false) +
    secHTML("log","main","Site logistics & access", fieldsHTML("log", LOGISTICS) + photosHTML("log|main"), true) +
    '</div>';

  /* rooms */
  if(!S.rooms.length){
    h += '<div class="card"><div class="empty">No rooms yet.<br>Tap <b>+ Room</b> to start the walkthrough.</div></div>';
  }
  S.rooms.forEach(function(r){
    var nm = r.d.name || ("Room " + r.id);
    h += '<div class="card" data-room="' + r.id + '">';
    h += '<div class="roomhd"><span class="nm">' + esc(nm) + '</span><span class="pct" data-pct="' + r.id + '"></span></div>';
    ROOM_SECTIONS.forEach(function(s){
      var inner = s.special === "light"
        ? lightHTML(r.id)
        : fieldsHTML(r.id, s.fields) + photosHTML(r.id + "|" + s.id);
      h += secHTML(r.id, s.id, s.title, inner, s.id !== "id");
    });
    h += '<div class="roomtools">' +
      '<button class="btn sm" data-dup="' + r.id + '">Duplicate</button>' +
      '<button class="btn sm ghost" data-delroom="' + r.id + '">Delete room</button></div>';
    h += '</div>';
  });

  /* utility */
  h += '<div class="card"><div class="roomtools" style="border:0;background:none;flex-wrap:wrap">' +
    '<button class="btn sm ghost" id="imp">Import data</button>' +
    '<button class="btn sm ghost" id="raw">Show raw data</button>' +
    '<button class="btn sm ghost" id="wipe">Clear survey</button></div></div>';
  h += '<div style="text-align:center;color:var(--muted);font-size:11px;padding:0 0 8px">' +
       (STORAGE_OK
         ? 'Saves automatically on this device. Export before switching phones.'
         : '&#9888; Autosave unavailable in this viewer &mdash; your work is held in memory only. Open the file directly in a browser, or use &ldquo;Show raw data&rdquo; before closing.') +
       '</div>';

  document.getElementById("app").innerHTML = h;
  updateProgress();
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("input", function(e){
  var t = e.target;
  var scope = t.getAttribute && t.getAttribute("data-scope");
  var k = t.getAttribute && t.getAttribute("data-k");
  if(!scope || !k) return;
  setV(scope, k, t.value);
  if(k === "name"){
    var card = t.closest("[data-room]");
    if(card){ card.querySelector(".roomhd .nm").textContent = t.value || ("Room " + scope); }
  }
  if(["lux_disp","lux_mid","lux_rear","scr_diag","scr_gain","disptype","far","viewtype"].indexOf(k) > -1){
    refreshCalc(scope);
  }
  updateProgress();
});
document.addEventListener("change", function(e){
  var t = e.target;
  if(t.tagName === "SELECT" && t.getAttribute("data-scope")){
    setV(t.getAttribute("data-scope"), t.getAttribute("data-k"), t.value);
    refreshCalc(t.getAttribute("data-scope"));
    updateProgress();
  }
});

document.addEventListener("click", function(e){
  var t = e.target.closest("button, .skipbtn");
  if(!t) return;

  /* skip toggle sits inside the header button — handle first, stop bubbling */
  var sk = e.target.closest("[data-skip]");
  if(sk){
    e.stopPropagation(); e.preventDefault();
    var key = sk.getAttribute("data-skip");
    S.skipped[key] = !S.skipped[key];
    save(); render();
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-toggle")){
    var kk = t.getAttribute("data-toggle");
    var sec = document.querySelector('[data-sec="' + CSS.escape(kk) + '"]');
    var nowOpen = !sec.classList.contains("open");
    sec.classList.toggle("open", nowOpen);
    S.ui[kk] = nowOpen; save();
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-tri")){
    var wrap = t.parentNode;
    var sc = wrap.getAttribute("data-scope"), key2 = wrap.getAttribute("data-k");
    var val = t.getAttribute("data-v");
    var cur = getV(sc, key2);
    var nv = (cur === val) ? "" : val;
    setV(sc, key2, nv);
    Array.prototype.forEach.call(wrap.querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === nv));
    });
    var note = wrap.parentNode.querySelector("[data-issuenote]");
    if(note) note.style.display = (nv === "issue") ? "" : "none";
    updateProgress();
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-chip")){
    var w2 = t.parentNode;
    var sc2 = w2.getAttribute("data-scope"), k2 = w2.getAttribute("data-k");
    var arr = getV(sc2,k2); if(!Array.isArray(arr)) arr = [];
    var v2 = t.getAttribute("data-v");
    var i = arr.indexOf(v2);
    if(i > -1) arr.splice(i,1); else arr.push(v2);
    setV(sc2,k2,arr);
    t.setAttribute("aria-pressed", String(i === -1));
    updateProgress();
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-luxp")){
    var w3 = t.parentNode;
    var sc3 = w3.getAttribute("data-scope");
    var v3 = t.getAttribute("data-v");
    var cur3 = getV(sc3,"lux_preset");
    var nv3 = String(cur3) === String(v3) ? "" : v3;
    setV(sc3,"lux_preset",nv3);
    Array.prototype.forEach.call(w3.querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === nv3));
    });
    refreshCalc(sc3); updateProgress();
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-addph")){ pickPhoto(t.getAttribute("data-addph")); return; }

  if(t.hasAttribute && t.hasAttribute("data-delph")){
    var strip = t.closest("[data-photos]");
    var pk = strip.getAttribute("data-photos");
    S.photos[pk].splice(parseInt(t.getAttribute("data-delph"),10), 1);
    save(); render();
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-dup")){
    var src = S.rooms.filter(function(r){ return String(r.id) === t.getAttribute("data-dup"); })[0];
    var copy = { id: seq++, d: JSON.parse(JSON.stringify(src.d)) };
    copy.d.name = (src.d.name || "Room") + " (copy)";
    S.rooms.push(copy); save(); render();
    window.scrollTo(0, document.body.scrollHeight);
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-delroom")){
    var rid = t.getAttribute("data-delroom");
    armConfirm(t, "Tap again to delete", function(){
      S.rooms = S.rooms.filter(function(r){ return String(r.id) !== rid; });
      Object.keys(S.photos).forEach(function(pk){ if(pk.indexOf(rid + "|") === 0) delete S.photos[pk]; });
      save(); render();
    });
    return;
  }

  if(t.id === "addroom"){
    var r = { id: seq++, d:{} };
    S.rooms.push(r);
    S.ui[r.id + "|id"] = true;
    save(); render();
    var card = document.querySelector('[data-room="' + r.id + '"]');
    if(card) card.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  if(t.id === "save"){ exportJSON(); return; }
  if(t.id === "pdf"){ buildPrint(); return; }
  if(t.id === "imp"){ document.getElementById("jsonin").click(); return; }
  if(t.id === "raw"){ showRaw(JSON.stringify(S,null,2), "Survey data (copy & paste to save)"); return; }
  if(t.id === "wipe"){
    armConfirm(t, "Tap again to clear everything", function(){
      S = { visit:{}, log:{}, rooms:[], photos:{}, skipped:{}, ui:{} };
      seq = 1; save(); render();
    });
    return;
  }
});

/* ============================================================
   PHOTOS
   ============================================================ */
var photoTarget = null;
function pickPhoto(key){
  photoTarget = key;
  var inp = document.getElementById("filein");
  inp.value = "";
  inp.click();
}
document.getElementById("filein").addEventListener("change", function(e){
  var files = Array.prototype.slice.call(e.target.files || []);
  if(!files.length || !photoTarget) return;
  var key = photoTarget;
  var pending = files.length;
  files.forEach(function(file){
    compress(file, function(dataUrl){
      if(dataUrl){
        if(!S.photos[key]) S.photos[key] = [];
        S.photos[key].push(dataUrl);
      }
      if(--pending === 0){ save(); render(); }
    });
  });
});

function compress(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 900;
      var scale = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      try { cb(c.toDataURL("image/jpeg", 0.62)); } catch(err){ cb(null); }
    };
    img.onerror = function(){ cb(null); };
    img.src = reader.result;
  };
  reader.onerror = function(){ cb(null); };
  reader.readAsDataURL(file);
}

/* ============================================================
   IMPORT / EXPORT
   ============================================================ */
function slug(){
  var c = (S.visit.client || "site").replace(/[^a-z0-9]+/gi,"-").toLowerCase().replace(/^-|-$/g,"");
  var d = S.visit.date || "";
  return "avl-survey-" + c + (d ? "-" + d : "");
}
function exportJSON(){
  var json = JSON.stringify(S,null,2);
  try {
    var blob = new Blob([json], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = slug() + ".json";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    toast("Exported. No file? Use “Show raw data”.");
  } catch(e){
    showRaw(json, "Download blocked — copy this instead");
  }
}
document.getElementById("jsonin").addEventListener("change", function(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var d = JSON.parse(r.result);
      S = { visit:d.visit||{}, log:d.log||{}, rooms:d.rooms||[], photos:d.photos||{}, skipped:d.skipped||{}, ui:d.ui||{} };
      seq = 1; S.rooms.forEach(function(x){ if(x.id >= seq) seq = x.id + 1; });
      save(); render(); toast("Survey imported");
    } catch(err){ toast("That file didn't parse"); }
  };
  r.readAsText(f);
  e.target.value = "";
});

/* ============================================================
   PRINT / PDF VIEW
   ============================================================ */
function label(fields,k){
  var f = fields.filter(function(x){ return x.k === k; })[0];
  return f ? f.l : k;
}
function disp(v){
  if(Array.isArray(v)) return v.join(", ");
  if(v === "ok") return "OK";
  if(v === "issue") return "ISSUE";
  if(v === "na") return "N/A";
  return String(v);
}
function tableFor(scope, fields){
  var rows = fields.map(function(f){
    var v = getV(scope, f.k);
    if(!answered(v)) return "";
    var note = getV(scope, f.k + "_note");
    return '<tr><td class="k">' + esc(f.l) + '</td><td class="v">' + esc(disp(v)) +
           (answered(note) ? ' — ' + esc(note) : "") + '</td></tr>';
  }).join("");
  return rows ? '<table>' + rows + '</table>' : '';
}
function printPhotos(key){
  var l = S.photos[key] || [];
  if(!l.length) return "";
  return '<div class="pg">' + l.map(function(p){ return '<img src="' + p + '">'; }).join("") + '</div>';
}

function buildPrint(){
  var h = "";
  h += '<h1>AVL Pre-Install Site Survey</h1>';
  h += '<div class="meta">' + esc(S.visit.client || "—") + ' &middot; ' + esc(S.visit.site || "—") +
       ' &middot; ' + esc(S.visit.date || "—") + ' &middot; Surveyor: ' + esc(S.visit.surveyor || "—") + '</div>';
  h += '<h2>Visit details</h2>' + tableFor("visit", VISIT);
  if(!S.skipped["log|main"]){
    var logT = tableFor("log", LOGISTICS), logP = printPhotos("log|main");
    if(logT || logP) h += '<h2>Site logistics &amp; access</h2>' + logT + logP;
  }

  S.rooms.forEach(function(r){
    h += '<div class="rm"><h2>' + esc(r.d.name || ("Room " + r.id)) + '</h2>';
    ROOM_SECTIONS.forEach(function(s){
      if(S.skipped[r.id + "|" + s.id]) return;
      if(s.special === "light"){
        var lf = [
          {k:"lt_time",l:"Time of reading"},{k:"lt_sky",l:"Sky"},{k:"lt_shade",l:"Window treatment"},
          {k:"lt_src",l:"Light sources"},{k:"lux_disp",l:"Lux at display wall"},{k:"lux_mid",l:"Lux mid seating"},
          {k:"lux_rear",l:"Lux rear / window wall"},{k:"lux_preset",l:"Estimated lux (no meter)"},
          {k:"disptype",l:"Intended display type"},{k:"scr_diag",l:"Diagonal (in)"},{k:"scr_gain",l:"Screen gain"}
        ];
        var tbl = tableFor(r.id, lf);
        var lp = printPhotos(r.id + "|light");
        if(tbl || lp){
          h += '<h3>Ambient light</h3>' + tbl;
          var tmp = document.createElement("div");
          tmp.innerHTML = calcHTML(r.id);
          var txt = tmp.textContent.replace(/\s+/g," ").trim();
          if(txt && txt.indexOf("Enter a lux reading") === -1) h += '<div class="cal">' + esc(txt) + '</div>';
          h += lp;
        }
      } else {
        var t2 = tableFor(r.id, s.fields);
        var p2 = printPhotos(r.id + "|" + s.id);
        if(t2 || p2) h += '<h3>' + esc(s.title) + '</h3>' + t2 + p2;
      }
    });
    h += '</div>';
  });

  document.getElementById("print").innerHTML = h;
  setTimeout(function(){
    try { window.print(); }
    catch(e){ toast("Printing blocked here — open the file in your browser"); }
  }, 120);
}

/* ============================================================
   BOOT
   ============================================================ */
load();
if(S.ui["visit|main"] === undefined) S.ui["visit|main"] = true;
render();

/* ---- offline service worker ---- */
var swApplyingUpdate = false;
var swUpdateDismissed = false;

function showUpdateNotice(reg){
  if(!reg || !reg.waiting || swUpdateDismissed) return;
  if(document.getElementById("swUpdateNotice")) return;

  var host = document.getElementById("systemNotices");
  if(!host) return;

  var bar = document.createElement("div");
  bar.className = "sysnotice";
  bar.id = "swUpdateNotice";
  bar.setAttribute("role","status");

  var msg = document.createElement("span");
  msg.className = "msg";
  msg.innerHTML = "<b>Update ready.</b> Apply it now or keep working and update later.";

  var later = document.createElement("button");
  later.type = "button";
  later.id = "swUpdateLater";
  later.textContent = "Later";
  later.onclick = function(){
    swUpdateDismissed = true;
    if(bar.parentNode) bar.parentNode.removeChild(bar);
  };

  var apply = document.createElement("button");
  apply.type = "button";
  apply.className = "pri";
  apply.id = "swUpdateNow";
  apply.textContent = "Update";
  apply.onclick = function(){
    if(!reg.waiting) return;
    swApplyingUpdate = true;
    apply.disabled = true;
    later.disabled = true;
    apply.textContent = "Updating...";
    reg.waiting.postMessage({type:"SKIP_WAITING"});
  };

  bar.appendChild(msg);
  bar.appendChild(later);
  bar.appendChild(apply);
  host.appendChild(bar);
}

function watchForUpdate(reg){
  if(reg.waiting) showUpdateNotice(reg);
  reg.addEventListener("updatefound", function(){
    var worker = reg.installing;
    if(!worker) return;
    worker.addEventListener("statechange", function(){
      if(worker.state === "installed" && navigator.serviceWorker.controller){
        showUpdateNotice(reg);
      }
    });
  });
}

function checkForUpdate(reg){
  reg.update().catch(function(){ /* update check unavailable — cached app still works */ });
}

if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(!swApplyingUpdate) return;
    swApplyingUpdate = false;
    window.location.reload();
  });

  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js", {updateViaCache:"none"}).then(function(reg){
      watchForUpdate(reg);
      checkForUpdate(reg);
      window.addEventListener("focus", function(){ checkForUpdate(reg); });
      document.addEventListener("visibilitychange", function(){
        if(document.visibilityState === "visible") checkForUpdate(reg);
      });
    }).catch(function(){ /* offline caching unavailable — app still runs */ });
  });
}

/* ---- add-to-home-screen hint (iOS gives no install prompt API) ---- */
(function(){
  var standalone = window.navigator.standalone === true ||
                   (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  if(standalone) return;
  if(store.get("avl_hint_dismissed") === "1") return;
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  var bar = document.createElement("div");
  bar.className = "sysnotice";
  bar.innerHTML = '<span class="msg">' +
    (isIOS
      ? 'Install for offline use: tap <b>Share</b>, then <b>Add to Home Screen</b>.'
      : 'Install for offline use: open the browser menu and choose <b>Add to Home screen</b>.') +
    '</span>';
  var x = document.createElement("button");
  x.textContent = "Got it";
  x.onclick = function(){
    store.set("avl_hint_dismissed","1");
    if(bar.parentNode) bar.parentNode.removeChild(bar);
  };
  bar.appendChild(x);
  setTimeout(function(){
    var host = document.getElementById("systemNotices");
    if(host) host.appendChild(bar);
  }, 900);
})();

window.__avl = { recNits:recNits, recLumens:recLumens, minDiag:minDiag, maxViewFt:maxViewFt, targetFL:targetFL, S:function(){ return S; } };
