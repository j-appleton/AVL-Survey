<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>PrePlot</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PrePlot">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e2e5ea;
  --accent:#2563eb; --accent-soft:#eff4ff;
  --ok:#0f7b4f; --ok-bg:#e7f5ee; --warn:#b45309; --warn-bg:#fdf3e3; --na:#6b7280; --na-bg:#eef0f3;
  --danger:#b42318; --danger-fill:#b42318;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115; --card:#171a21; --ink:#e8eaee; --muted:#9aa1ad; --line:#2a2f3a;
    --accent:#5b8cff; --accent-soft:#1b2436;
    --ok:#4ade80; --ok-bg:#12291d; --warn:#fbbf24; --warn-bg:#2c2210; --na:#9aa1ad; --na-bg:#20242c;
    --danger:#f87171; --danger-fill:#b91c1c;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:96px;
}
.wrap{max-width:820px;margin:0 auto;padding:0 12px}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:50; background:var(--card);
  border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);
}
.hd{display:flex;align-items:center;gap:10px;padding:10px 12px;max-width:820px;margin:0 auto}
.hd h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em;flex:1}
.hd .sub{display:block;font-size:11px;color:var(--muted);font-weight:400}
.viewtabs{
  display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:0 12px 8px;
  max-width:820px;margin:0 auto
}
.viewtabs button{
  min-height:34px;border:1px solid var(--line);background:var(--bg);color:var(--muted);
  border-radius:8px;font:inherit;font-size:12px;font-weight:650;cursor:pointer
}
.viewtabs button[aria-selected="true"]{
  background:var(--accent-soft);border-color:var(--accent);color:var(--accent)
}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;max-width:820px;margin:0 auto 8px;width:calc(100% - 24px)}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.corechip{font-size:11px;padding:4px 8px;border-radius:99px;background:var(--na-bg);color:var(--muted);white-space:nowrap}
.corechip.done{background:var(--ok-bg);color:var(--ok)}

/* ---------- cards / sections ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:12px 0;overflow:hidden;scroll-margin-top:88px}
.sec{scroll-margin-top:88px}
.sec{border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sechd{
  display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none;
  background:none;border:0;width:100%;text-align:left;color:inherit;font:inherit
}
.sechd:active{background:var(--accent-soft)}
.sechd .t{flex:1;font-weight:600;font-size:15px}
.sechd .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.sechd .car{transition:transform .18s;color:var(--muted);font-size:12px}
.sec.open .sechd .car{transform:rotate(90deg)}
.secbody{display:none;padding:2px 14px 16px}
.sec.open .secbody{display:block}
.sec.skipped .sechd .t{opacity:.45;text-decoration:line-through}
.sec.skipped .secbody{display:none}

/* ---------- fields ---------- */
.f{margin:12px 0}
.f>label,.flab{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.flab .core{color:var(--accent);font-size:15px;line-height:1;vertical-align:middle}
.hint{font-size:12px;color:var(--muted);font-weight:400;margin-top:4px;display:block}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--ink);font:inherit;font-size:16px
}
textarea{min-height:66px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.f{flex:1;min-width:96px;margin:0}
.row+.row{margin-top:12px}

/* tri-state */
.tri{display:flex;gap:6px}
.tri button{
  flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer
}
.tri button[aria-pressed=true][data-v=ok]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.tri button[aria-pressed=true][data-v=issue]{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.tri button[aria-pressed=true][data-v=na]{background:var(--na-bg);color:var(--na);border-color:var(--na)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{
  padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:99px;font:inherit;font-size:13px;cursor:pointer
}
.chips button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}

/* buttons */
button.btn{
  padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer
}
button.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.ghost{color:var(--muted)}
button.btn.sm{padding:7px 10px;font-size:13px}
button.btn:active{transform:translateY(1px)}

/* photos */
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photoitem{position:relative;width:76px;height:76px;flex:0 0 76px}
.ph{
  display:block;position:relative;width:76px;height:76px;padding:0;border-radius:9px;overflow:hidden;
  border:1px solid var(--line);background:var(--card);cursor:zoom-in;color:inherit
}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.phload{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:7px;color:var(--muted);font-size:10px;line-height:1.2;text-align:center
}
.ph.ready .phload{display:none}
.ph:focus{outline:2px solid var(--accent);outline-offset:2px}
.phdel{
  position:absolute;top:2px;right:2px;z-index:2;width:22px;height:22px;border-radius:99px;border:0;
  background:rgba(0,0,0,.62);color:#fff;font:inherit;font-size:13px;font-weight:600;line-height:1;cursor:pointer;padding:0;
  white-space:nowrap
}
.phdel[data-armed="1"]{width:56px;padding:0 8px;background:var(--danger-fill);font-size:11px}
.phdel:focus{outline:2px solid var(--accent);outline-offset:2px}
.addph{
  width:76px;height:76px;border:1.5px dashed var(--line);border-radius:9px;background:none;
  color:var(--muted);font-size:11px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px
}
.addph span:first-child{font-size:19px}
.phrecovery{margin:8px 0 0}
.phrecovery-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.phrecovery-actions button{background:var(--card)}
.photosview .photo-group{padding:2px 14px 14px;border-top:1px solid var(--line)}
.photosview .photo-group:first-child{border-top:0}
.photosview .photo-group-title{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px}
.photosview .photo-add-row{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 14px 14px
}
.photosview .photo-add-row label{font-size:12px;font-weight:650;color:var(--muted)}
.photosview .photo-add-row select{flex:1;min-width:160px;padding:8px 10px;font-size:14px}
.photosview .site-photo-card .roomhd{background:var(--card)}
.cover-card{padding:16px;margin-bottom:12px}
.cover-card h2{margin:0;font-size:18px;color:var(--ink)}
.cover-copy{margin:5px 0 12px;color:var(--muted);font-size:13px;line-height:1.4}
.cover-preview{
  display:block;width:100%;max-height:320px;min-height:180px;padding:0;margin:12px 0 8px;
  overflow:hidden;border:2px solid var(--accent);border-radius:12px;background:var(--card);
  position:relative;color:var(--muted);cursor:zoom-in
}
.cover-preview img{display:block;width:100%;height:100%;max-height:316px;object-fit:cover}
.cover-preview .phload{font-size:12px}
.cover-preview.ready .phload{display:none}
.cover-file{font-size:12px;font-weight:650;color:var(--muted);overflow-wrap:anywhere}
.cover-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cover-select-note{
  margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);
  color:var(--accent);font-size:13px;font-weight:650
}
.photoitem.cover-photo .ph{border:3px solid var(--accent)}
.photoitem.cover-candidate .ph{border:3px solid var(--gold,#c8992f)}
.cover-badge{
  position:absolute;left:3px;bottom:3px;z-index:2;border-radius:99px;padding:3px 6px;
  background:var(--accent);color:#fff;font-size:9px;font-weight:750;line-height:1
}
.photoitem.cover-candidate .cover-badge{background:#8a6415}

/* full-screen stored-photo viewer */
.phviewer{
  position:fixed;inset:0;z-index:200;background:#0b101b;color:#fff;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right))
          max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))
}
.phvtop,.phvbottom{display:flex;align-items:center;gap:10px;min-height:48px}
.phvtitle{flex:1;min-width:0;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phvcount{font-size:13px;color:#cbd5e1;white-space:nowrap}
.phvclose,.phvnav{
  width:44px;height:44px;border:1px solid rgba(255,255,255,.32);border-radius:99px;
  background:rgba(0,0,0,.32);color:#fff;font:inherit;font-size:24px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none
}
.phvclose{font-size:19px}
.phvclose:focus,.phvnav:focus{outline:3px solid #93c5fd;outline-offset:2px}
.phvstage{
  min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden;border-radius:10px
}
.phvimage{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.phvnav{position:absolute;top:50%;transform:translateY(-50%);z-index:1}
.phvnav.prev{left:4px}.phvnav.next{right:4px}
.phvnav:disabled{opacity:.28;cursor:default}
.phvbottom{justify-content:center;flex-wrap:wrap;padding-top:8px}
.phvsave,.phvdownload,.phvcover{
  min-height:48px;border-radius:12px;padding:11px 18px;font:inherit;font-size:15px;
  font-weight:700;cursor:pointer;text-align:center
}
.phvsave{width:min(100%,360px);border:1px solid #60a5fa;background:#2563eb;color:#fff}
.phvsave:disabled{opacity:.58;cursor:default}
.phvdownload,.phvcover{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff}
.phvcover[aria-pressed="true"]{border-color:#5eead4;background:#134e4a;color:#fff}
.phvdownload[hidden]{display:none}
.phvdownload:disabled{opacity:.45;cursor:default}
.phvhelp,.phvstatus{flex:0 0 100%;text-align:center;font-size:12px;line-height:1.35;color:#cbd5e1}
.phvstatus:empty{display:none}

/* computed panel */
.calc{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:12px;margin:14px 0}
.calc h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.calc .big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.calc .lbl{font-size:12px;color:var(--muted)}
.calc .grid{display:flex;gap:18px;flex-wrap:wrap}
.flag{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:600}
.flag.bad{background:var(--na-bg);color:var(--danger)}

/* lux scale */
.lux{display:grid;grid-template-columns:1fr;gap:6px}
.lux button{
  display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:1px solid var(--line);
  background:var(--card);border-radius:10px;font:inherit;cursor:pointer;color:var(--ink)
}
.lux button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.lux .sw{width:26px;height:26px;border-radius:7px;flex:none;border:1px solid rgba(0,0,0,.12)}
.lux .nm{flex:1;font-size:14px;font-weight:600}
.lux .vl{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* rooms */
.roomhd{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.roomhd .nm{flex:1;font-weight:700;font-size:16px}
.roomhd .pct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.roomtools{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line);background:var(--bg)}
.pkg{border-top:1px solid var(--line);padding:12px 0;margin-top:12px}
.pkgtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.pkgtools .btn{flex:1;min-width:180px}
.pkgsummary{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.pkgstatus{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}

/* footer bar */
.foot{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
  border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom))
}
.foot .in{max-width:820px;margin:0 auto;display:flex;gap:8px}
.foot .in button{flex:1}

.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:14px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:99;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center
}
.toast.on{opacity:.95}
.sysnotices{
  position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:80;
  width:calc(100% - 16px);max-width:804px;display:flex;flex-direction:column;gap:8px;
  pointer-events:none
}
.sysnotice{
  background:var(--ink);color:var(--bg);padding:11px 13px;border-radius:12px;
  font-size:13px;line-height:1.35;display:flex;gap:8px;align-items:center;
  box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:auto
}
.sysnotice .msg{flex:1}
.sysnotice button{
  background:none;border:1px solid currentColor;color:inherit;border-radius:8px;
  padding:5px 9px;font:inherit;font-size:12px;cursor:pointer;flex:none
}
.sysnotice button.pri{background:var(--bg);color:var(--ink)}
.sysnotice button:disabled{opacity:.6;cursor:default}
.skipbtn{font-size:11px;padding:4px 8px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:11px}

</style>
</head>
<body>

<header>
  <div class="hd">
    <div style="flex:1">
      <h1>PrePlot</h1>
    </div>
    <span class="corechip" id="corechip">core 0/0</span>
  </div>
  <div class="viewtabs" role="tablist" aria-label="Survey view">
    <button type="button" role="tab" data-app-view="survey" aria-selected="true">Survey</button>
    <button type="button" role="tab" data-app-view="photos" aria-selected="false">Photos</button>
  </div>
  <div class="bar"><i id="bar"></i></div>
</header>

<div class="wrap" id="app"></div>

<div class="foot"><div class="in">
  <button class="btn" id="addroom">+ Room</button>
  <button class="btn pri" id="pkgjump">Package</button>
</div></div>

<div class="toast" id="toast"></div>
<div class="sysnotices" id="systemNotices" aria-live="polite"></div>
<input type="file" id="filein" accept="image/*" capture="environment" multiple hidden>
<input type="file" id="jsonin" accept="application/zip,.zip,application/json,.json" hidden>

<script src="./photo-store.js"></script>
<script>
"use strict";

/* ============================================================
   STORAGE — localStorage with in-memory fallback so the app
   never hard-fails in a restricted preview environment.
   ============================================================ */
var mem = {};
var store = {
  get: function(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } },
  set: function(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ mem[k]=v; return false; } }
};
var KEY         = "avl_survey_v1";  // live survey
var BACKUP_KEY  = "avl_backup_v1";  // pre-destructive-op snapshot
var SALVAGE_KEY = "avl_salvage_v1"; // unreadable payload, kept rather than discarded
var STORAGE_OK = (function(){
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
  catch(e){ return false; }
})();

/* App + data versions. SCHEMA is the shape of the persisted survey and is the
   only thing migrations key off. Bump it and add a MIGRATIONS entry together. */
var APP_VERSION = "1.16.0";
var SCHEMA = 3;

/* ============================================================
   SCHEMA
   t: text|num|date|time|area|sel|tri|chips
   c: 1 = core field (the stuff we must not leave site without)
   ============================================================ */
var VISIT = [
  {k:"client",  l:"Client / organisation", t:"text", c:1},
  {k:"site",    l:"Site address",          t:"text", c:1},
  {k:"date",    l:"Date",                  t:"date", c:1},
  {k:"surveyor",l:"Surveyor",              t:"text"},
  {k:"contact", l:"Site contact (name / role / mobile)", t:"text", c:1},
  {k:"itc",     l:"IT contact", t:"text", h:"Separate person 90% of the time. Get them now."},
  {k:"scope",   l:"Scope as understood on arrival", t:"area", h:"Note anything that doesn't match the sales scope."}
];

var LOGISTICS = [
  {k:"access",  l:"Delivery / dock access OK", t:"tri"},
  {k:"elev",    l:"Elevator size & weight limit", t:"text", h:"The number that kills LED wall deliveries."},
  {k:"hours",   l:"Work hours / noise restrictions", t:"text"},
  {k:"badge",   l:"Badging or escort required", t:"tri"},
  {k:"storage", l:"Secure on-site storage available", t:"tri"},
  {k:"lognote", l:"Logistics notes", t:"area"}
];

/* Ambient light has a custom UI, but its fields still need one canonical
   definition. reportLabel and reportTileLabel preserve the deliberately
   different language used by the PDF without creating another field list. */
var LIGHT_FIELDS = [
  {k:"lt_time", l:"Time of day", t:"time", inline:1,
    reportLabel:"Ambient light \u00b7 Time of day"},
  {k:"lt_sky", l:"Sky", t:"sel",
    o:["","Sunny","Partly cloudy","Overcast","Dark / night"], inline:1,
    reportLabel:"Ambient light \u00b7 Sky"},
  {k:"lt_shade", l:"Window treatment", t:"sel",
    o:["","None fitted","Fitted \u2014 open","Fitted \u2014 closed","Partial / sheer"],
    reportLabel:"Ambient light \u00b7 Window treatment"},
  {k:"lt_src", l:"Light sources present", t:"chips",
    o:["Overhead LED/fluorescent","Downlights","North-facing glass",
      "South/E/W-facing glass","Skylight","Accent / decorative","Stage lighting"],
    reportLabel:"Ambient light \u00b7 Light sources"},
  {k:"lux_disp", l:"At display wall", t:"num", inline:1,
    reportTileLabel:"Display wall", reportTileKind:"measured"},
  {k:"lux_mid", l:"Mid seating", t:"num", inline:1,
    reportTileLabel:"Mid seating", reportTileKind:"measured"},
  {k:"lux_rear", l:"Rear / window wall", t:"num", inline:1,
    reportTileLabel:"Rear / windows", reportTileKind:"measured"},
  {k:"lux_preset", l:"Estimated ambient light", t:"luxpreset",
    reportTileLabel:"Ambient light", reportTileKind:"estimated"},
  {k:"disptype", l:"Intended display type", t:"sel",
    o:["","Direct-view (LCD / LED)","Projection"],
    reportLabel:"Ambient light \u00b7 Intended display"},
  {k:"scr_diag", l:"Diagonal (in)", t:"num", inline:1,
    reportLabel:"Ambient light \u00b7 Screen diagonal"},
  {k:"scr_gain", l:"Screen gain", t:"num", inline:1,
    h:"Projection only. 1.0 if unknown.",
    reportLabel:"Ambient light \u00b7 Screen gain"}
];
function lightFields(keys){
  return keys.map(function(key){
    return LIGHT_FIELDS.filter(function(field){ return field.k === key; })[0];
  }).filter(function(field){ return !!field; });
}

var ROOM_SECTIONS = [
  { id:"id", title:"Room", fields:[
    {k:"name", l:"Room name / number", t:"text", c:1},
    {k:"type", l:"Room type", t:"sel", o:["","Huddle","Conference","Boardroom","Training","Classroom","Auditorium","Sanctuary / worship","Multipurpose","Lobby / digital signage","Control room","Other"], c:1},
    {k:"seats",l:"Seats / occupancy", t:"num"},

/* Recommended direct-view display brightness for a given ambient lux */
function recNits(lux){
  if(lux <= 100)  return 350;
  if(lux <= 300)  return 500;
  if(lux <= 600)  return 700;
  if(lux <= 1000) return 1000;
  return 1500;
}
/* Target screen luminance (footLamberts) for projection at a given ambient lux */
function targetFL(lux){
  if(lux <= 50)  return 16;
  if(lux <= 150) return 25;
  if(lux <= 300) return 35;
  return 50;
}
/* 16:9 geometry from diagonal (inches) */
function wh169(diag){ return { w: diag*0.87157, h: diag*0.49029 }; }
function areaSqFt(diag){ var g = wh169(diag); return (g.w*g.h)/144; }

/* Projector lumens = fL x area(sqft) / gain, x1.4 headroom for lamp ageing & losses */
function recLumens(lux, diag, gain){
  if(!diag || diag <= 0) return null;
  gain = gain || 1.0;
  return Math.round(targetFL(lux) * areaSqFt(diag) / gain * 1.4);
}
/* DISCAS-style max viewing distance (ft) for a 16:9 diagonal */
function maxViewFt(diag, analytical){
  var h = wh169(diag).h;                 // image height, inches
  return (h * (analytical ? 4 : 6)) / 12;
}
/* Minimum diagonal (in) needed for a furthest-seat distance */
function minDiag(farFt, analytical){
  if(!farFt || farFt <= 0) return null;
  var hNeeded = (farFt*12) / (analytical ? 4 : 6);
  return Math.ceil(hNeeded / 0.49029);
}

function nowISO(){ try { return new Date().toISOString(); } catch(e){ return ""; } }
function blankState(){
  return {
    visit:{}, log:{}, rooms:[], photos:{}, skipped:{}, ui:{},
    meta:{created:nowISO(), updated:nowISO(), app:APP_VERSION}
  };
}
var S = blankState();
var seq = 1;

/* Key = the schema version being migrated FROM. Never delete an entry:
   older exports still need to walk the complete chain. */
var MIGRATIONS = {
  1: function(d){
    d.meta = {created:nowISO(), updated:nowISO(), app:APP_VERSION, migratedFrom:1};
    return d;
  },
  2: function(d){
    d.meta = d.meta || {};
    if(typeof d.meta.migratedFrom === "undefined") d.meta.migratedFrom = 2;
    return d;
  }
};

/* Recognise either a versioned envelope or a legacy bare-state payload. */
function normalize(p){
  if(!p || typeof p !== "object") return null;
  if(p.app === "avl-survey" && typeof p.schema === "number" && p.data && typeof p.data === "object"){
    return {schema:p.schema, data:p.data};
  }
  if(Object.prototype.hasOwnProperty.call(p,"visit") || Object.prototype.hasOwnProperty.call(p,"rooms")){
    return {schema:1, data:p};
  }
  return null;
}

function isPhotoDescriptor(value){
  return !!value && typeof value === "object" && !Array.isArray(value) &&
    typeof value.id === "string" && value.id.length > 0 &&
    typeof value.mime === "string" && value.mime.length > 0 &&
    typeof value.bytes === "number" && isFinite(value.bytes) && value.bytes >= 0 &&
    Math.floor(value.bytes) === value.bytes &&
    typeof value.width === "number" && isFinite(value.width) && value.width >= 0 &&
    Math.floor(value.width) === value.width &&
    typeof value.height === "number" && isFinite(value.height) && value.height >= 0 &&
    Math.floor(value.height) === value.height;
}
function photoEntryValid(value){
  return typeof value === "string" || isPhotoDescriptor(value);
}
function stateHasPhotoDescriptors(data){
  var photos = data && data.photos;
  if(!photos || typeof photos !== "object") return false;
  return Object.keys(photos).some(function(key){
    var list = photos[key];
    return Array.isArray(list) && list.some(isPhotoDescriptor);
  });
}

/* Reject damaged payloads before they can replace good survey data. */
function validate(d){
  if(!d || typeof d !== "object") return {ok:false, reason:"not an object"};
  if(!Array.isArray(d.rooms)) return {ok:false, reason:"rooms is not a list"};

  var bad = null;
  d.rooms.forEach(function(r,i){
    if(bad) return;
    if(!r || typeof r !== "object") bad = "room " + i + " is not an object";
    else if(typeof r.id === "undefined") bad = "room " + i + " has no id";
    else if(!r.d || typeof r.d !== "object") bad = "room " + i + " has no field data";
  });
  if(bad) return {ok:false, reason:bad};

  var objs = ["visit","log","photos","skipped","ui"];
  for(var i=0;i<objs.length;i++){
    var v = d[objs[i]];
    if(typeof v !== "undefined" && (v === null || typeof v !== "object" || Array.isArray(v))){
      return {ok:false, reason:objs[i] + " is malformed"};
    }
  }
  var photoIds = {};
  var photoKeys = Object.keys(d.photos || {});
  for(var p=0;p<photoKeys.length;p++){
    var list = d.photos[photoKeys[p]];
    if(!Array.isArray(list)) return {ok:false, reason:"photo bucket " + photoKeys[p] + " is not a list"};
    for(var q=0;q<list.length;q++){
      if(!photoEntryValid(list[q])){
        return {ok:false, reason:"photo " + photoKeys[p] + "|" + q + " is malformed"};
      }
      if(isPhotoDescriptor(list[q])){
        if(photoIds[list[q].id]) return {ok:false, reason:"photo id " + list[q].id + " is duplicated"};
        photoIds[list[q].id] = true;
      }
    }
  }
  return {ok:true};
}

/* Fill optional objects so a partial-but-valid payload cannot crash rendering. */
function coerce(d){
  var b = blankState();
  return {
    visit:d.visit || b.visit,
    log:d.log || b.log,
    rooms:d.rooms || b.rooms,
    photos:d.photos || b.photos,
    skipped:d.skipped || b.skipped,
    ui:d.ui || b.ui,
    meta:d.meta || b.meta
  };
}

/* payload -> {ok, data, from} | {ok:false, reason} */
function migrate(payload){
  var n = normalize(payload);
  if(!n) return {ok:false, reason:"unrecognised file — not an AVL survey export"};
  if(n.schema > SCHEMA){
    return {ok:false, reason:"created by a newer version of the app (v" + n.schema + "). Update the app first."};
  }

  var d = n.data;
  var v = n.schema;
  while(v < SCHEMA){
    var fn = MIGRATIONS[v];
    if(!fn) return {ok:false, reason:"no migration path from schema v" + v};
    try { d = fn(d); }
    catch(e){ return {ok:false, reason:"migration v" + v + " failed"}; }
    v++;
  }

  var val = validate(d);
  if(!val.ok) return {ok:false, reason:val.reason};
  return {ok:true, data:coerce(d), from:n.schema};
}

function reseq(){
  seq = 1;
  S.rooms.forEach(function(r){
    var n = parseInt(r.id,10);
    if(!isNaN(n) && n >= seq) seq = n + 1;
  });
}

function load(){
  var raw = store.get(KEY);
  if(!raw) return;
  var parsed;
  try { parsed = JSON.parse(raw); }
  catch(e){
    store.set(SALVAGE_KEY, raw);
    toast("Saved data was unreadable — a copy was kept");
    return;
  }

  var res = migrate(parsed);
  if(!res.ok){
    store.set(SALVAGE_KEY, raw);
    toast("Saved data not loaded: " + res.reason);
    return;
  }

  S = res.data;
  reseq();
  if(res.from < SCHEMA) save();
}

function blobToDataUrl(blob){
  return new Promise(function(resolve,reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(String(reader.result)); };
    reader.onerror = function(){ reject(reader.error || new Error("Could not read photo")); };
    try { reader.readAsDataURL(blob); }
    catch(error){ reject(error); }
  });
}
function portablePhotoEntry(key, index){
  var entry = photoValue(key,index);
  var selected = !!(entry && S.visit.coverPhotoId === photoEntryIdentity(entry));
  if(typeof entry === "string"){
    return Promise.resolve({
      mime:photoMime(entry),
      width:0,
      height:0,
      bytes:photoEntryBytes(entry),
      data:entry,
      cover:selected
    });
  }
  if(!isPhotoDescriptor(entry)) return Promise.reject(new Error("Photo entry is malformed"));
  return hydratePhotoSource(key,index).then(function(source){
    return blobToDataUrl(source.blob).then(function(data){
      return {
        mime:entry.mime,
        width:entry.width,
        height:entry.height,
        bytes:entry.bytes,
        data:data,
        cover:selected
      };
    });
  });
}
function portableEnvelope(){
  /* Clone state without serialising inline photo payloads only to throw that
     copy away. This keeps the export path bounded on a 50–60 photo survey. */
  var data = JSON.parse(JSON.stringify({
    visit:S.visit,
    log:S.log,
    rooms:S.rooms,
    photos:{},
    skipped:S.skipped,
    ui:S.ui,
    meta:S.meta
  }));
  var keys = Object.keys(photoBuckets());
  var chain = Promise.resolve();
  keys.forEach(function(key){
    data.photos[key] = [];
    photoList(key).forEach(function(entry,index){
      chain = chain.then(function(){
        return portablePhotoEntry(key,index).then(function(portable){
          data.photos[key].push(portable);
        });
      });
    });
  });
  return chain.then(function(){
    return {
      app:"avl-survey",
      schema:3,
      photoFormat:"inline",
      appVersion:APP_VERSION,
      exportedAt:nowISO(),
      data:data
    };
  });
}

function persistSurvey(){
  if(S.meta) S.meta.updated = nowISO();

      if(notice.parentNode) notice.parentNode.removeChild(notice);

  saveTimer = null;

    photoCaptureSaveSuppressed = true;

  saveTimer = setTimeout(function(){

/* Survey state remains in localStorage. New photo bytes live in IndexedDB and
   localStorage keeps only compact descriptors, while legacy and fallback
   inline photos still count against this ~5 MB ceiling. */
var LS_CAP = 5 * 1024 * 1024;
var deviceInfo = {used:0, quota:0, known:false};
var photoIntegrityState = "checking";
var missingPhotoIds = {};
var storagePersistState = "checking";
var storagePersistRequested = false;

function fmtMB(bytes){
  if(bytes >= 1048576) return (bytes/1048576).toFixed(1) + " MB";
  return Math.round(bytes/1024) + " KB";
}
function localBytes(){
  try {
    var total = 0;
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      total += (k.length + (localStorage.getItem(k) || "").length) * 2;
    }
    return total;
  } catch(e){
    return JSON.stringify(S).length * 2;
  }
}
function photoCount(){
  var n = 0;
  Object.keys(photoBuckets()).forEach(function(k){
    n += photoList(k).length;
  });
  return n;
}
function photoStorageCounts(){
  var counts = {inline:0, descriptors:0, missing:0};
  Object.keys(photoBuckets()).forEach(function(key){
    photoList(key).forEach(function(entry){
      if(isPhotoDescriptor(entry)){
        counts.descriptors++;
        if(missingPhotoIds[entry.id]) counts.missing++;
      } else {
        counts.inline++;
      }
    });
  });
  return counts;
}
function hasSurveyWork(){
  if(S.rooms.length || photoCount()) return true;
  var scopes = [S.visit || {}, S.log || {}];
  for(var i=0;i<scopes.length;i++){
    var keys = Object.keys(scopes[i]);
    for(var j=0;j<keys.length;j++){
      if(answered(scopes[i][keys[j]])) return true;
    }
  }
  return Object.keys(S.skipped || {}).some(function(k){ return !!S.skipped[k]; });
}
function storageHTML(){
  var salvage = store.get(SALVAGE_KEY);
  var salvageHTML = salvage
    ? '<div class="flag bad" data-salvage-warning style="margin:0 0 10px">' +
      'Saved survey data could not be read by this version of the app. A copy is still on this device. ' +
      'Update the app before continuing, and do not start a replacement survey - the old one has not been deleted.</div>'
    : '';
  if(!STORAGE_OK){
    return salvageHTML +
      '<div class="flag bad" style="margin:0">Storage unavailable in this viewer. Nothing is being saved.</div>';
  }

  var used = localBytes();
  var pct = Math.min(100, Math.round(used / LS_CAP * 100));
  var color = pct >= 85 ? "var(--danger)" : (pct >= 60 ? "var(--warn)" : "var(--ok)");
  var count = photoCount();
  var h = salvageHTML +
    '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px">' +
    '<span>' + fmtMB(used) + ' of about ' + fmtMB(LS_CAP) + '</span>' +
    '<span>' + count + ' photo' + (count === 1 ? '' : 's') + '</span></div>';
  h += '<div style="height:7px;background:var(--line);border-radius:99px;overflow:hidden">' +
    '<i style="display:block;height:100%;width:' + Math.max(pct,1) + '%;background:' + color + '"></i></div>';

  if(pct >= 85){
    h += '<div class="flag bad" style="margin-top:8px">Nearly full. Prepare the visit package now — new photos may fail to save.</div>';
  } else if(pct >= 60){
    h += '<div class="flag" style="margin-top:8px">Over ' + pct + '% of the survey storage limit. Prepare the visit package and start a fresh survey soon.</div>';
  }
  if(deviceInfo.known){
    h += '<div class="hint" style="margin-top:6px">Device storage used by this app (estimate): ' +
      fmtMB(deviceInfo.used) + '</div>';
  }
  if(photoStoreLastError){
    h += '<div class="flag" data-photo-store-warning style="margin-top:8px">' +
      'Device photo storage failed for part of a capture. Those photos remain in the survey file. ' +
      'Prepare the visit package after the visit.</div>';
  }
  var photoStorage = photoStorageCounts();
  if(photoStorage.descriptors){
    var storedCount = photoStorage.descriptors - photoStorage.missing;
    if(photoIntegrityState === "unknown"){
      h += '<div class="flag" style="margin-top:8px">Photo storage could not be checked. Prepare the visit package after every visit.</div>';
    } else {
      h += '<div class="hint" style="margin-top:6px">' + storedCount + ' photo' +
        (storedCount === 1 ? '' : 's') + ' in device storage</div>';
    }
    h += '<div class="hint" style="margin-top:6px">' + photoStorage.inline + ' photo' +
      (photoStorage.inline === 1 ? '' : 's') + ' stored in the survey file</div>';
    if(photoStorage.missing){
      h += '<div class="flag bad" style="margin-top:8px">' + photoStorage.missing + ' photo' +
        (photoStorage.missing === 1 ? '' : 's') + ' missing from device storage</div>';
    } else if(photoIntegrityState === "checking"){
      h += '<div class="hint" style="margin-top:6px">Photo integrity: checking...</div>';
    }
    h += '<div class="hint" style="margin-top:6px">New photos are stored in device storage rather than in the survey file, so this figure stays low.</div>';
  }
  if(storagePersistState === "granted"){
    h += '<div class="hint" style="margin-top:6px">Storage retention: browser has agreed to keep this data. Prepare the visit package after every visit.</div>';
  } else if(storagePersistState === "denied"){
    h += '<div class="flag" style="margin-top:8px">Storage retention: not guaranteed - the browser may clear this. Prepare the visit package after every visit.</div>';
  } else if(storagePersistState === "unknown"){
    h += '<div class="flag" style="margin-top:8px">Storage retention: could not be checked. Prepare the visit package after every visit.</div>';
  } else if(storagePersistState === "unavailable"){
    h += '<div class="hint" style="margin-top:6px">Storage retention: not reportable in this browser. Prepare the visit package after every visit.</div>';
  } else {
    h += '<div class="hint" style="margin-top:6px">Storage retention: checking...</div>';
  }
  return h;
}
function updateStorageBar(){
  var el = document.getElementById("storagewrap");
  if(el) el.innerHTML = storageHTML();
}
function refreshStorageEstimate(){
  if(!navigator.storage || !navigator.storage.estimate) return;
  navigator.storage.estimate().then(function(e){
    deviceInfo = {used:e.usage || 0, quota:e.quota || 0, known:true};
    updateStorageBar();
  }).catch(function(){});
}

function descriptorIds(){
  var ids = [];
  Object.keys(photoBuckets()).forEach(function(key){
    photoList(key).forEach(function(entry){
      if(isPhotoDescriptor(entry)) ids.push(entry.id);
    });
  });
  return ids;
}
function refreshPhotoIntegrity(){
  var ids = descriptorIds();
  missingPhotoIds = {};
  if(!ids.length){
    photoIntegrityState = "ready";
    updateStorageBar();
    return Promise.resolve({missing:0,total:0});
  }
  photoIntegrityState = "checking";
  updateStorageBar();
  if(!window.AVLPhotoStore || typeof window.AVLPhotoStore.keys !== "function"){

        try { resolve(materializePhotoSource(key,index)); }
        catch(error){ reject(error); }

    pkg.message = "This browser cannot share the package. Download it instead.";
  } else {
    pkg.message = "Share sheet closed. Confirm the package appears in Google Drive before leaving the site.";
  }
  refreshPhotoPackageUI();
}
function sharePreparedPackage(){
  if(photoPackageFlight) return false;
  var pkg = preparedPhotoPackage;
  if(!pkg || pkg.status !== "ready" || !pkg.file) return false;
  if(!photoPackageIsCurrent(pkg)){
    markPhotoPackageStale(pkg);
    refreshPhotoPackageUI();
    return false;
  }
  var shareData = {files:[pkg.file],title:"PrePlot survey package"};
  var supported = false;
  try {
    supported = typeof navigator.share === "function" &&
      typeof navigator.canShare === "function" &&
      navigator.canShare(shareData);
  } catch(error){
    supported = false;
  }
  if(!supported){
    pkg.message = "This browser cannot share the package. Download it instead.";
    refreshPhotoPackageUI();
    return false;
  }

  var flight = {pkg:pkg,file:pkg.file};
  photoPackageFlight = flight;
  pkg.message = "";
  refreshPhotoPackageUI();
  var result;
  try {
    /* Nothing may be awaited above this native call. */
    result = navigator.share(shareData);
  } catch(error){
    finishPhotoPackageShare(
      flight,
      error && error.name === "AbortError" ? "cancel" : "failure"
    );
    return false;
  }
  Promise.resolve(result).then(function(){
    finishPhotoPackageShare(flight,"closed");
  }).catch(function(error){
    finishPhotoPackageShare(
      flight,
      error && error.name === "AbortError" ? "cancel" : "failure"
    );
  });
  return true;
}
function downloadPreparedPackage(){
  if(photoPackageFlight) return false;
  var pkg = preparedPhotoPackage;
  if(!pkg || pkg.status !== "ready" || !pkg.file) return false;
  if(!photoPackageIsCurrent(pkg)){
    markPhotoPackageStale(pkg);
    refreshPhotoPackageUI();
    return false;
  }
  try {
    if(!pkg.objectUrl) pkg.objectUrl = URL.createObjectURL(pkg.file);
    var url = pkg.objectUrl;
    var a = document.createElement("a");
    a.href = url;
    a.download = pkg.file.name;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    pkg.message = "Download started \u2014 confirm the ZIP appears in Files before leaving.";
    refreshPhotoPackageUI();
    setTimeout(function(){
      if(preparedPhotoPackage === pkg && pkg.objectUrl === url){
        try { URL.revokeObjectURL(url); } catch(error){}
        pkg.objectUrl = null;
      }
    },30000);
    return true;
  } catch(error){
    pkg.message = "This browser cannot download the package here. Use Share package instead.";
    refreshPhotoPackageUI();
    return false;
  }
}

function defaultPhotoShareHelp(){
  return "Opens your device share sheet. Choose Save Image, Photos, or Gallery.";
}
function refreshPhotoShareUI(){
  if(!photoViewer || !photoViewer.save) return;
  var busy = !!photoShareFlight;
  var id = photoIdentity(photoViewer.key, photoViewer.index);
  var resident = !!(photoViewer.file && photoViewer.asset &&
    photoViewer.asset.identity === photoEntryIdentity(photoValue(photoViewer.key,photoViewer.index)));
  photoViewer.save.disabled = busy || !resident || photoViewer.missing;
  photoViewer.save.textContent = busy
    ? "Opening share sheet\u2026"
    : (resident ? "Save photo\u2026" : (photoViewer.missing ? "Photo missing" : "Preparing photo\u2026"));
  photoViewer.download.hidden = !photoViewer.missing && photoViewer.fallbackId !== id;
  photoViewer.download.disabled = photoViewer.missing;
  if(photoViewer.cover){
    var current = photoValue(photoViewer.key,photoViewer.index);
    var selected = !!(current && S.visit.coverPhotoId === photoEntryIdentity(current));
    photoViewer.cover.setAttribute("aria-pressed",String(selected));
    photoViewer.cover.textContent = selected ? "Cover photo \u2713" : "Use as cover";
    photoViewer.cover.disabled = photoViewer.missing;
  }
  photoViewer.help.textContent = photoViewer.notice || defaultPhotoShareHelp();
  photoViewer.status.textContent = photoViewer.message || "";
}
function finishPhotoShare(flight, outcome, error){
  if(photoShareFlight !== flight) return;
  photoShareFlight = null;
  if(!photoViewer){
    return;
  }
  var currentId = photoIdentity(photoViewer.key, photoViewer.index);
  photoViewer.message = "";
  if(outcome === "cancel"){
    photoViewer.message = "Share cancelled. You can try again.";
  } else if(outcome === "failure" && currentId === flight.id){
    photoViewer.fallbackId = flight.id;
    photoViewer.message = "Could not open the share sheet. Download the image instead.";
  }
  refreshPhotoShareUI();
}
function sharePhoto(key, index){
  if(photoShareFlight) return false;
  var list = photoList(key);
  index = parseInt(index,10);
  if(isNaN(index) || index < 0 || index >= list.length) return false;

  /* The exact File is prepared while the viewer hydrates. The trusted tap does
     no decode, storage read or promise work above navigator.share(). */
  var file = photoViewer &&
    photoViewer.key === String(key) &&
    photoViewer.index === index &&
    photoViewer.asset &&
    photoViewer.asset.identity === photoEntryIdentity(photoValue(key,index))
      ? photoViewer.file
      : null;
  if(!file){
    if(photoViewer){
      photoViewer.fallbackId = photoIdentity(key,index);
      photoViewer.message = "This image is still preparing. Try again.";
      refreshPhotoShareUI();
    }
    return false;
  }

  var shareData = {files:[file], title:"AVL survey photo"};
  var supported = false;
  try {
    supported = typeof navigator.share === "function" &&
      typeof navigator.canShare === "function" &&
      navigator.canShare(shareData);
  } catch(error){
    supported = false;
  }
  if(!supported){
    if(photoViewer){
      photoViewer.fallbackId = photoIdentity(key,index);
      photoViewer.message = "File sharing is not available here. Download the image instead.";
      refreshPhotoShareUI();
    }
    return false;
  }
  var flight = {
    id:photoIdentity(key,index),
    key:String(key),
    index:index,
    file:file,
    leftPage:false
  };
  photoShareFlight = flight;
  if(photoViewer){
    photoViewer.message = "";
    refreshPhotoShareUI();
  }

  var result;
  try {
    /* This call must remain in the original click task: no await above it. */
    result = navigator.share(shareData);
  } catch(error){
    finishPhotoShare(flight, error && error.name === "AbortError" ? "cancel" : "failure", error);
    return false;
  }
  Promise.resolve(result).then(function(){
    /* A resolved share only means the system sheet closed. It does not reveal
       which destination the user chose, so never claim that the photo saved. */
    finishPhotoShare(flight, "closed");
  }).catch(function(error){
    finishPhotoShare(flight, error && error.name === "AbortError" ? "cancel" : "failure", error);
  });
  return true;
}
function downloadPhoto(key, index){
  var list = photoList(key);
  index = parseInt(index,10);
  if(isNaN(index) || index < 0 || index >= list.length) return false;
  try {
    var source = photoViewer &&
      photoViewer.key === String(key) &&
      photoViewer.index === index &&
      photoViewer.asset &&
      photoViewer.asset.identity === photoEntryIdentity(photoValue(key,index))
        ? photoViewer.asset
        : materializePhotoSource(key,index).asset;
    var file = new File(
      [source.blob],
      photoFileName(key,index,source.mime),
      {type:source.mime,lastModified:Date.now()}
    );
    var url = URL.createObjectURL(file);
    var a = document.createElement("a");
    a.href = url;
    a.download = file.name;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
    if(photoViewer){
      photoViewer.message = "Download started. Your browser may put it in Files or Downloads.";
      refreshPhotoShareUI();
    }
    return true;
  } catch(error){
    if(photoViewer){
      photoViewer.message = "This image could not be downloaded. Prepare the visit package before continuing.";
      refreshPhotoShareUI();
    }
    return false;
  }
}
function movePhotoViewer(delta){
  if(!photoViewer) return;
  var list = photoList(photoViewer.key);
  var next = photoViewer.index + delta;
  if(next < 0 || next >= list.length) return;
  photoViewer.index = next;
  photoViewer.fallbackId = null;
  photoViewer.message = "";
  photoViewer.notice = "";
  updatePhotoViewer();
}
function updatePhotoViewer(){
  if(!photoViewer) return;
  var list = photoList(photoViewer.key);
  if(!list.length){ closePhotoViewer(); return; }
  photoViewer.index = Math.max(0, Math.min(photoViewer.index, list.length - 1));
  var number = photoViewer.index + 1;
  var load = ++photoViewer.load;
  photoViewer.asset = null;
  photoViewer.file = null;
  photoViewer.missing = false;
  flushRetiredPhotoAssets();
  photoViewer.image.removeAttribute("src");
  photoViewer.image.alt = "Photo " + number + " of " + list.length + " \u2014 " + photoContext(photoViewer.key);
  photoViewer.title.textContent = photoContext(photoViewer.key);
  photoViewer.count.textContent = "Photo " + number + " of " + list.length;
  photoViewer.prev.disabled = photoViewer.index === 0;
  photoViewer.next.disabled = photoViewer.index === list.length - 1;
  refreshPhotoShareUI();
  var key = photoViewer.key;
  var index = photoViewer.index;
  hydratePhotoSource(key,index).then(function(source){
    if(!photoViewer || photoViewer.load !== load ||
       photoViewer.key !== key || photoViewer.index !== index ||
       !photoEntryMatches(key,index,source)){
      return;
    }
    photoViewer.asset = source.asset;
    photoViewer.file = new File(
      [source.blob],
      photoFileName(key,index,source.mime),
      {type:source.mime,lastModified:Date.now()}
    );
    photoViewer.image.src = source.url;
    refreshPhotoShareUI();
  }).catch(function(error){
    if(!photoViewer || photoViewer.load !== load) return;
    if(error && error.code === "PHOTO_MISSING"){
      photoViewer.missing = true;
      photoViewer.message = "This photo is not in device storage. It cannot be shared or included in the package.";
    } else {
      photoViewer.message = "This image could not be prepared.";
    }
    refreshPhotoShareUI();
  });
}
function closePhotoViewer(){
  if(!photoViewer) return;
  var closing = photoViewer;
  photoViewer = null;
  document.removeEventListener("keydown", photoViewerKeydown);
  if(closing.overlay.parentNode) closing.overlay.parentNode.removeChild(closing.overlay);
  restorePhotoViewerScroll(closing.scroll);
  var trigger = photoTrigger(closing.key, closing.returnIndex);
  if(trigger) trigger.focus();
  if(closing.asset && closing.asset.retired) revokePhotoAsset(closing.asset,true);
  flushRetiredPhotoAssets();
  reconcilePhotoAssets();
}
function photoViewerKeydown(e){
  if(!photoViewer) return;
  if(e.key === "Escape"){
    e.preventDefault();
    closePhotoViewer();
    return;
  }
  if(e.key === "ArrowLeft" && !photoViewer.prev.disabled){
    e.preventDefault();
    movePhotoViewer(-1);
    return;
  }
  if(e.key === "ArrowRight" && !photoViewer.next.disabled){
    e.preventDefault();
    movePhotoViewer(1);
    return;
  }
  if(e.key === "Tab"){
    var controls = Array.prototype.slice.call(photoViewer.overlay.querySelectorAll("button:not(:disabled)"));
    if(!controls.length) return;
    var first = controls[0], last = controls[controls.length - 1];
    if(e.shiftKey && document.activeElement === first){
      e.preventDefault(); last.focus();
    } else if(!e.shiftKey && document.activeElement === last){
      e.preventDefault(); first.focus();
    }
  }
}
function openPhotoViewer(key, index, notice){

  var lock = lockPhotoViewerScroll();
  photoViewer = {

  };
  overlay.querySelector("[data-phv-close]").onclick = closePhotoViewer;

/* Some Web Share implementations settle late or not at all after the native
   sheet backgrounds the PWA. Returning to the page safely clears the guard. */
document.addEventListener("visibilitychange", function(){
  if(!photoShareFlight) return;
  if(document.visibilityState === "hidden"){
    photoShareFlight.leftPage = true;
  } else if(photoShareFlight.leftPage){
    finishPhotoShare(photoShareFlight, "closed");
  }
});

/* ============================================================
   VALUE ACCESS
   scope = "visit" | "log" | room id (number)
   ============================================================ */
function bag(scope){
  if(scope === "visit") return S.visit;
  if(scope === "log")   return S.log;
  var r = S.rooms.filter(function(x){ return String(x.id) === String(scope); })[0];
  return r ? r.d : {};
}
function getV(scope,k){ var b = bag(scope); return b[k]; }
function setV(scope,k,v){ bag(scope)[k] = v; save(); }

function answered(v){
  if(v === undefined || v === null) return false;
  if(Array.isArray(v)) return v.length > 0;
  return String(v).trim() !== "";
}
/* A select converted to chips can still hold one legacy string. Rendering and
   the first tap must agree so that answer is visible and never discarded. */
function chipValues(v){
  return Array.isArray(v) ? v : (answered(v) ? [String(v)] : []);
}

/* ============================================================
   FIELD RENDERING
   ============================================================ */
function esc(s){
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function fieldHTML(scope, f){
  var v = getV(scope, f.k);
  var id = "f_" + scope + "_" + f.k;
  var lab = '<span class="flab"><label for="'+id+'">'+esc(f.l)+
            (f.c ? ' <span class="core" title="Core field">&bull;</span>' : '')+'</label></span>';
  var hint = f.h ? '<span class="hint">'+esc(f.h)+'</span>' : '';
  var da = 'data-scope="'+esc(scope)+'" data-k="'+esc(f.k)+'"';
  var body = "";

  if(f.t === "text" || f.t === "num" || f.t === "date" || f.t === "time"){
    var type = f.t === "num" ? "number" : (f.t === "text" ? "text" : f.t);
    var extra = f.t === "num" ? ' inputmode="decimal" step="any"' : "";
    body = '<input id="'+id+'" type="'+type+'" '+da+extra+' value="'+esc(v)+'">';
  }
  else if(f.t === "area"){
    body = '<textarea id="'+id+'" '+da+'>'+esc(v)+'</textarea>';
  }
  else if(f.t === "sel"){
    body = '<select id="'+id+'" '+da+'>' + f.o.map(function(o){
      return '<option value="'+esc(o)+'"'+(String(v||"") === o ? " selected" : "")+'>'+
             (o === "" ? "—" : esc(o))+'</option>';
    }).join("") + '</select>';
  }
  else if(f.t === "tri"){
    body = '<div class="tri" '+da+'>' +
      [["ok","OK"],["issue","Issue"],["na","N/A"]].map(function(p){
        return '<button type="button" data-tri data-v="'+p[0]+'" aria-pressed="'+(v === p[0])+'">'+p[1]+'</button>';
      }).join("") + '</div>' +
      '<div style="margin-top:6px;'+(v === "issue" ? "" : "display:none")+'" data-issuenote>' +
        '<input type="text" placeholder="What\'s the issue?" data-scope="'+esc(scope)+'" data-k="'+esc(f.k)+'_note" value="'+esc(getV(scope,f.k+"_note"))+'">' +
      '</div>';
  }
  else if(f.t === "chips"){
    var arr = chipValues(v);
    body = '<div class="chips" '+da+'>' + f.o.map(function(o){
      return '<button type="button" data-chip data-v="'+esc(o)+'" aria-pressed="'+(arr.indexOf(o) > -1)+'">'+esc(o)+'</button>';
    }).join("") + '</div>';
  }

  return '<div class="f'+(f.inline ? " inl" : "")+'">'+lab+body+hint+'</div>';
}

function fieldsHTML(scope, fields){
  var out = "", buf = [];
  function flush(){
    if(!buf.length) return;
    out += '<div class="row">' + buf.join("") + '</div>';
    buf = [];
  }
  fields.forEach(function(f){
    if(f.inline){ buf.push(fieldHTML(scope,f)); }
    else { flush(); out += fieldHTML(scope,f); }
  });
  flush();
  return out;
}

/* ============================================================
   AMBIENT LIGHT MODULE
   ============================================================ */
function lightHTML(scope){
  var d = bag(scope);
  var meas = [num(d.lux_disp), num(d.lux_mid), num(d.lux_rear)].filter(function(x){ return x !== null; });
  var worst = meas.length ? Math.max.apply(null, meas) : (num(d.lux_preset) || null);
  var isProj = d.disptype === "Projection";

  var h = "";
  h += fieldsHTML(scope, lightFields(["lt_time","lt_sky"]));
  h += fieldsHTML(scope, lightFields(["lt_shade","lt_src"]));

  h += '<div class="f"><span class="flab">Measured lux <span class="core">&bull;</span></span>' +
       '<span class="hint" style="margin:0 0 8px">Meter or phone app, held at the surface, facing the light. Take all three if you can.</span></div>';
  h += fieldsHTML(scope, lightFields(["lux_disp","lux_mid","lux_rear"]));

  h += '<div class="f"><span class="flab">No meter? Pick the closest match</span><div class="lux" data-scope="'+esc(scope)+'" data-k="lux_preset">' +
    LUX_PRESETS.map(function(p){
      return '<button type="button" data-luxp data-v="'+p.v+'" aria-pressed="'+(String(d.lux_preset) === String(p.v))+'">' +
             '<span class="sw" style="background:'+p.c+'"></span>' +
             '<span class="nm">'+p.n+'<span class="hint" style="font-weight:400;margin:0">'+p.d+'</span></span>' +
             '<span class="vl">~'+p.v+' lx</span></button>';
    }).join("") + '</div></div>';

  h += fieldsHTML(scope, lightFields(["disptype","scr_diag","scr_gain"]));

  /* ---- computed panel ---- */
  h += '<div class="calc" data-calc="'+esc(scope)+'">' + calcHTML(scope) + '</div>';
  return h;
}

function num(x){
  if(x === undefined || x === null || String(x).trim() === "") return null;
  var n = parseFloat(x);
  return isNaN(n) ? null : n;
}

function calcHTML(scope){
  var d = bag(scope);
  var atDisp = num(d.lux_disp), mid = num(d.lux_mid), rear = num(d.lux_rear);
  var meas = [atDisp, mid, rear].filter(function(x){ return x !== null; });

  /* Washout is driven by illuminance falling on the display surface.
     Prefer the display-wall reading; fall back to the highest measured, then the preset. */
  var basis, basisLabel;
  if(atDisp !== null){ basis = atDisp; basisLabel = "at display wall"; }
  else if(meas.length){ basis = Math.max.apply(null, meas); basisLabel = "highest measured"; }
  else { basis = num(d.lux_preset); basisLabel = "estimated"; }

  if(basis === null){
    return '<h4>Brightness requirement</h4><span class="lbl">Enter a lux reading or pick a preset above.</span>';
  }
  var worst = basis;
  var isProj = d.disptype === "Projection";
  var diag = num(d.scr_diag);
  var gain = num(d.scr_gain) || 1.0;
  var out = '<h4>Brightness requirement &mdash; ' + Math.round(worst) + ' lux ' + basisLabel + '</h4><div class="grid">';

  if(isProj){
    var lum = recLumens(worst, diag, gain);
    out += '<div><div class="big">' + targetFL(worst) + ' fL</div><div class="lbl">target screen luminance</div></div>';
    out += '<div><div class="big">' + (lum ? lum.toLocaleString() : "—") + '</div><div class="lbl">ANSI lumens min' + (lum ? "" : " (enter diagonal)") + '</div></div>';
    out += '</div>';
    if(worst > 300) out += '<div class="flag bad">' + Math.round(worst) + ' lux is too bright for projection. Specify direct-view LED or get shading committed in writing.</div>';
    else if(lum) out += '<div class="flag" style="background:transparent;color:var(--muted);font-weight:400;padding:8px 0 0">Includes 1.4&times; headroom for lamp ageing and optical loss, at ' + gain + ' gain.</div>';
  } else {
    out += '<div><div class="big">' + recNits(worst) + ' nits</div><div class="lbl">minimum panel brightness</div></div>';
    if(diag){
      out += '<div><div class="big">' + diag + '&Prime;</div><div class="lbl">specified diagonal</div></div>';
    }
    out += '</div>';
    if(worst > 1000) out += '<div class="flag bad">Over 1000 lux. Standard commercial panels will wash out — high-brightness display or shading required.</div>';
    else if(worst > 600) out += '<div class="flag">Bright room. Confirm the panel is rated 700 nits or better.</div>';
  }

  /* daylight migration: a much brighter rear/window reading means the display-wall
     figure will not hold all day, and glare hits the seats before it hits the screen */
  var others = [mid, rear].filter(function(x){ return x !== null; });
  if(atDisp !== null && others.length){
    var hi = Math.max.apply(null, others);
    if(hi > atDisp * 1.8 && hi - atDisp > 150){
      out += '<div class="flag">Room reads up to ' + Math.round(hi) + ' lux elsewhere. Daylight will move across the day — note shading and re-check at the worst hour.</div>';
    }
  }

  /* sightline sizing check pulls from the display section */
  var far = num(d.far);
  var analytical = d.viewtype === "Analytical / detailed content";
  if(far){
    var need = minDiag(far, analytical);
    out += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--accent)">';
    out += '<h4 style="margin-bottom:6px">Sizing check &mdash; furthest seat ' + far + ' ft</h4>';
    out += '<div class="grid"><div><div class="big">' + need + '&Prime;</div><div class="lbl">minimum diagonal (' + (analytical ? "analytical" : "general") + ')</div></div>';
    if(diag){
      var can = maxViewFt(diag, analytical);
      out += '<div><div class="big">' + can.toFixed(1) + ' ft</div><div class="lbl">' + diag + '&Prime; is good to</div></div>';
    }
    out += '</div>';
    if(diag && diag < need) out += '<div class="flag">' + diag + '&Prime; is undersized for this room. Step up to ' + need + '&Prime; or larger.</div>';
    out += '</div>';
  }
  return out;
}

function refreshCalc(scope){
  var el = document.querySelector('[data-calc="' + CSS.escape(String(scope)) + '"]');
  if(el) el.innerHTML = calcHTML(scope);

/* ============================================================
   PROGRESS
   ============================================================ */
function allFieldsFor(scope){
  if(scope === "visit") return VISIT;
  if(scope === "log")   return LOGISTICS;
  var out = [];
  ROOM_SECTIONS.forEach(function(s){
    if(S.skipped[scope + "|" + s.id]) return;
    if(s.special === "light"){
      out.push({k:"lux_disp", c:1});
      out.push({k:"lt_shade"});
      out.push({k:"disptype"});
    } else {
      out = out.concat(s.fields);
    }
  });
  return out;
}
function progress(scope){
  var f = allFieldsFor(scope), done = 0, core = 0, coreDone = 0;
  f.forEach(function(x){
    var a = answered(getV(scope, x.k));
    if(a) done++;
    if(x.c){ core++; if(a) coreDone++; }
  });
  return { total:f.length, done:done, core:core, coreDone:coreDone };
}
function updateProgress(){
  var t = 0, d = 0, c = 0, cd = 0;
  ["visit","log"].concat(S.rooms.map(function(r){ return r.id; })).forEach(function(sc){
    var p = progress(sc);
    t += p.total; d += p.done; c += p.core; cd += p.coreDone;
  });
  document.getElementById("bar").style.width = (t ? (d/t*100) : 0) + "%";
  var chip = document.getElementById("corechip");
  chip.textContent = "core " + cd + "/" + c;
  chip.className = "corechip" + (c > 0 && cd === c ? " done" : "");
  S.rooms.forEach(function(r){
    var el = document.querySelector('[data-pct="' + r.id + '"]');
    if(el){ var p = progress(r.id); el.textContent = p.coreDone + "/" + p.core + " core"; }
  });
}

function groupedPhotoManifest(){
  var manifest = photoManifest();
  var groups = [];
  manifest.forEach(function(entry){
    var last = groups[groups.length - 1];
    if(!last || last.key !== entry.key){
      last = {
        key:entry.key,
        roomId:entry.roomId,
        roomName:entry.roomName,
        sectionId:entry.sectionId,
        sectionLabel:entry.sectionLabel,
        entries:[]
      };
      groups.push(last);
    }
    last.entries.push(entry);
  });
  return {manifest:manifest,groups:groups};
}

function roomPhotoAddHTML(room, used){
  var available = ROOM_SECTIONS.filter(function(section){
    return !used[section.id];
  });
  if(!available.length) return "";
  return '<div class="photo-add-row">' +
    '<label for="photoadd-'+esc(room.id)+'">Add photos to</label>' +
    '<select id="photoadd-'+esc(room.id)+'" data-photo-add-select="'+esc(room.id)+'">' +
      available.map(function(section){
        return '<option value="'+esc(room.id+"|"+section.id)+'">'+esc(section.title)+'</option>';
      }).join("") +
    '</select>' +
    '<button type="button" class="btn sm" data-add-room-photos="'+esc(room.id)+'">+ Photo</button>' +
    '</div>';
}

function photoRoomCardHTML(room, groups){
  var roomId = String(room.id);

    inner += '<div class="photo-group" data-photo-group="'+esc(group.key)+'">' +
      '<div class="photo-group-title">'+esc(group.sectionLabel)+'</div>' +

      '<span class="cnt">'+groups.reduce(function(total,group){ return total + group.entries.length; },0)+' photos</span>' +
    '</button>' +

function photosViewHTML(){
  var grouped;
  try { grouped = groupedPhotoManifest(); }
  catch(error){
    return '<div class="card"><div class="empty">Photos could not be listed. Reload the app before continuing.</div></div>';
  }
  var h = '<div class="photosview" data-photos-view>' + coverCardHTML();

  h += '<div class="card site-photo-card">' +
    '<div class="roomhd"><span class="nm">'+esc((S.visit && S.visit.site) || "Site")+'</span>' +
    '<span class="pct">'+siteGroups.reduce(function(total,group){ return total + group.entries.length; },0)+' photos</span></div>';
  if(siteGroups.length){
    siteGroups.forEach(function(group){
      h += '<div class="photo-group" data-photo-group="'+esc(group.key)+'">' +
        '<div class="photo-group-title">'+esc(group.sectionLabel)+'</div>' +

        '</div>';

function updateViewTabs(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-app-view]"),function(button){
    button.setAttribute("aria-selected",String(button.getAttribute("data-app-view") === currentAppView));
  });
}

function switchAppView(view){
  if(view !== "survey" && view !== "photos") return false;
  resetAllPhotoDeletes();
  if(view !== "photos"){
    coverSelectMode = false;
    coverCandidate = "";
  }
  currentAppView = view;
  render();
  return true;
}

function render(){
  document.getElementById("app").innerHTML =
    currentAppView === "photos" ? photosViewHTML() : surveyViewHTML();
  updateViewTabs();
  updateProgress();
  hydratePhotoThumbnails();
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("input", function(e){
  var t = e.target;
  var scope = t.getAttribute && t.getAttribute("data-scope");
  var k = t.getAttribute && t.getAttribute("data-k");
  if(!scope || !k) return;
  setV(scope, k, t.value);
  if(k === "name"){
    var card = t.closest("[data-room]");
    if(card){ card.querySelector(".roomhd .nm").textContent = t.value || ("Room " + scope); }
  }
  if(["lux_disp","lux_mid","lux_rear","scr_diag","scr_gain","disptype","far","viewtype"].indexOf(k) > -1){
    refreshCalc(scope);
  }
  updateProgress();
});
document.addEventListener("change", function(e){
  var t = e.target;
  if(t.tagName === "SELECT" && t.getAttribute("data-scope")){
    setV(t.getAttribute("data-scope"), t.getAttribute("data-k"), t.value);
    refreshCalc(t.getAttribute("data-scope"));
    updateProgress();
  }
});

document.addEventListener("click", function(e){
  var t = e.target.closest("button, .skipbtn");
  if(!t) return;

  if(t.hasAttribute && t.hasAttribute("data-app-view")){
    switchAppView(t.getAttribute("data-app-view"));
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-photo-room-toggle")){
    var photoRoomId = t.getAttribute("data-photo-room-toggle");
    photoRoomOpen[photoRoomId] = photoRoomOpen[photoRoomId] === false;
    render();
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-add-room-photos")){
    var photoRoomSelect = document.querySelector(
      '[data-photo-add-select="' + CSS.escape(t.getAttribute("data-add-room-photos")) + '"]'
    );
    if(photoRoomSelect && photoRoomSelect.value) pickPhoto(photoRoomSelect.value);
    return;
  }

  /* skip toggle sits inside the header button — handle first, stop bubbling */
  var sk = e.target.closest("[data-skip]");
  if(sk){
    e.stopPropagation(); e.preventDefault();
    var key = sk.getAttribute("data-skip");
    S.skipped[key] = !S.skipped[key];
    save(); render();
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-toggle")){
    var kk = t.getAttribute("data-toggle");
    var sec = document.querySelector('[data-sec="' + CSS.escape(kk) + '"]');
    var nowOpen = !sec.classList.contains("open");
    sec.classList.toggle("open", nowOpen);
    S.ui[kk] = nowOpen; save();
    if(nowOpen) hydratePhotoThumbnails();
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-tri")){
    var wrap = t.parentNode;
    var sc = wrap.getAttribute("data-scope"), key2 = wrap.getAttribute("data-k");
    var val = t.getAttribute("data-v");
    var cur = getV(sc, key2);
    var nv = (cur === val) ? "" : val;
    setV(sc, key2, nv);
    Array.prototype.forEach.call(wrap.querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === nv));
    });
    var note = wrap.parentNode.querySelector("[data-issuenote]");
    if(note) note.style.display = (nv === "issue") ? "" : "none";
    updateProgress();
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-chip")){
    var w2 = t.parentNode;
    var sc2 = w2.getAttribute("data-scope"), k2 = w2.getAttribute("data-k");
    var arr = chipValues(getV(sc2,k2));
    var v2 = t.getAttribute("data-v");
    var i = arr.indexOf(v2);
    if(i > -1) arr.splice(i,1); else arr.push(v2);
    setV(sc2,k2,arr);
    t.setAttribute("aria-pressed", String(i === -1));
    updateProgress();
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-luxp")){
    var w3 = t.parentNode;
    var sc3 = w3.getAttribute("data-scope");
    var v3 = t.getAttribute("data-v");
    var cur3 = getV(sc3,"lux_preset");
    var nv3 = String(cur3) === String(v3) ? "" : v3;
    setV(sc3,"lux_preset",nv3);
    Array.prototype.forEach.call(w3.querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === nv3));
    });
    refreshCalc(sc3); updateProgress();
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-viewph")){
    var item = t.closest("[data-photo-key][data-photo-index]");
    if(item && coverSelectMode){
      var choice = photoValue(item.getAttribute("data-photo-key"),item.getAttribute("data-photo-index"));
      if(choice){
        coverCandidate = photoEntryIdentity(choice);
        render();
      }
    } else if(item){
      openPhotoViewer(item.getAttribute("data-photo-key"), item.getAttribute("data-photo-index"));
    }
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-cover-choose")){
    coverSelectMode = true;
    coverCandidate = "";
    render();
    return;
  }
  if(t.hasAttribute && t.hasAttribute("data-cover-cancel")){
    coverSelectMode = false;
    coverCandidate = "";
    render();
    return;
  }
  if(t.hasAttribute && t.hasAttribute("data-cover-confirm")){
    if(coverManifestEntry(coverCandidate)){
      S.visit.coverPhotoId = coverCandidate;
      coverSelectMode = false;
      coverCandidate = "";
      save();
      render();
    }
    return;
  }
  if(t.hasAttribute && t.hasAttribute("data-cover-remove")){
    S.visit.coverPhotoId = "";
    coverSelectMode = false;
    coverCandidate = "";
    save();
    render();
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-recoverph")){
    openPhotoViewer(
      t.getAttribute("data-photo-key"),
      t.getAttribute("data-photo-index"),
      "This photo is available now but could not be added to the survey. Save it before leaving this page."
    );
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-addph")){ pickPhoto(t.getAttribute("data-addph")); return; }

  if(t.hasAttribute && t.hasAttribute("data-delph")){
    var strip = t.closest("[data-photos]");
    var pk = strip.getAttribute("data-photos");
    armPhotoDelete(t, function(){
      var list = photoList(pk);
      var index = parseInt(t.getAttribute("data-delph"),10);
      if(isNaN(index) || index < 0 || index >= list.length){
        render();
        return;
      }
      if(coverCandidate === photoEntryIdentity(list[index])) coverCandidate = "";
      clearCoverPhotoIfEntry(list[index]);
      list.splice(index, 1);
      adjustPhotoCaptureRecoveriesAfterDelete(pk,index);
      save(); render();
    });
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-dup")){
    var src = S.rooms.filter(function(r){ return String(r.id) === t.getAttribute("data-dup"); })[0];
    var copy = { id: seq++, d: JSON.parse(JSON.stringify(src.d)) };
    copy.d.name = (src.d.name || "Room") + " (copy)";
    S.rooms.push(copy); save(); render();
    window.scrollTo(0, document.body.scrollHeight);
    return;
  }

  if(t.hasAttribute && t.hasAttribute("data-delroom")){
    var rid = t.getAttribute("data-delroom");
    armConfirm(t, "Tap again to delete", function(){
      S.rooms = S.rooms.filter(function(r){ return String(r.id) !== rid; });
      Object.keys(photoBuckets()).forEach(function(pk){
        if(pk.indexOf(rid + "|") !== 0) return;
        photoList(pk).forEach(clearCoverPhotoIfEntry);
        delete S.photos[pk];
      });
      save(); render();
    });
    return;
  }

  if(t.id === "addroom"){
    var r = { id: seq++, d:{} };
    S.rooms.push(r);
    S.ui[r.id + "|id"] = true;
    save(); render();
    var card = document.querySelector('[data-room="' + r.id + '"]');
    if(card) card.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  if(t.id === "pkgjump"){
    coverSelectMode = false;
    coverCandidate = "";
    currentAppView = "survey";
    render();
    var packageWrap = document.getElementById("photopackagewrap");
    if(packageWrap) packageWrap.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  if(t.id === "pkgprepare"){ preparePhotoPackage(); return; }
  if(t.id === "pkgshare"){ sharePreparedPackage(); return; }
  if(t.id === "pkgdownload"){ downloadPreparedPackage(); return; }
  if(t.id === "imp"){ document.getElementById("jsonin").click(); return; }
  if(t.id === "restore"){
    armConfirm(t, "Tap again to restore", function(){ restoreBackup(); });
    return;
  }
  if(t.id === "wipe"){
    armConfirm(t, "Tap again to clear everything", function(){
      snapshot();
      photoCaptureRecoveries = [];
      S = blankState();
      seq = 1; save(); render();
      toast("Cleared — recoverable via Restore backup");
    });
    return;
  }
});
