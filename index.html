var photoTarget = null;
var photoStoreLastError = "";
var photoStoreFailureKind = "";
var photoCaptureFlight = Promise.resolve();
var photoCapturePendingCount = 0;
var photoCompressTimeoutMs = 15000;
var orphanedPhotoIds = [];

function rememberOrphanedPhotoId(id){
  id = String(id || "");
  if(id && orphanedPhotoIds.indexOf(id) < 0) orphanedPhotoIds.push(id);
}

function activePhotoCaptureRecoveries(key){
  var list = photoList(key);
  return photoCaptureRecoveries.filter(function(item){
    return item.key === String(key) &&
      item.index >= 0 &&
      item.index < list.length &&
      list[item.index] === item.source;
  });
}

function photoCaptureRecoveryHTML(key){
  var items = activePhotoCaptureRecoveries(key);
  if(!items.length) return "";
  var count = items.length;
  var memoryOnly = items.filter(function(item){ return item.kind === "memory-only"; }).length;
  var unreferenced = count - memoryOnly;
  var message;
  if(count === 1 && memoryOnly){
    message = "1 photo is available now but could not be added to the survey. " +
      "Closing this page will lose it. Save it before leaving this page.";
  } else if(count === 1){
    message = "1 photo is in device storage but could not be added to the survey. " +
      "Prepare the visit package or save it before leaving this page.";
  } else {
    message = count + " photos could not be added to the survey.";
    if(memoryOnly){
      message += " " + memoryOnly + (memoryOnly === 1 ? " is" : " are") +
        " available only until this page closes.";
    }
    if(unreferenced){
      message += " " + unreferenced + (unreferenced === 1 ? " is" : " are") +
        " in device storage without a persisted survey reference.";
    }
    message += " Prepare the visit package or save them before leaving this page.";
  }
  return '<div class="flag bad phrecovery" role="alert" data-photo-recovery="'+esc(key)+'">' +
    '<div>'+esc(message)+'</div>' +
    '<div class="phrecovery-actions">' +
      items.map(function(item){
        return '<button type="button" class="btn sm" data-recoverph data-photo-key="'+esc(key)+
          '" data-photo-index="'+item.index+'">Save photo '+(item.index + 1)+'\u2026</button>';
      }).join("") +
    '</div></div>';
}

function rememberPhotoCaptureFailure(key, item, kind){
  photoCaptureRecoveries.push({
    key:String(key),
    index:item.index,
    source:item.source,
    kind:kind
  });
}

function adjustPhotoCaptureRecoveriesAfterDelete(key, index){
  photoCaptureRecoveries = photoCaptureRecoveries.filter(function(item){
    if(item.key !== String(key)) return true;
    if(item.index === index) return false;
    if(item.index > index) item.index--;
    return true;
  });
}

function clearCoverPhotoIfEntry(entry){
  if(entry && S.visit.coverPhotoId === photoEntryIdentity(entry)){
    S.visit.coverPhotoId = "";
    return true;
  }
  return false;
}

function setPhotoStoreFailure(kind, error){
  photoStoreFailureKind = kind;
  photoStoreLastError = error && error.message ? error.message : "Photo storage failed";
  updateStorageBar();
}

function photoStoreIdle(){
  return photoCaptureIdle();
}

function photoStoreStatus(){
  return {
    pending:photoCapturePendingCount,
    lastError:photoStoreLastError,
    kind:photoStoreFailureKind,
    orphaned:orphanedPhotoIds.slice()
  };
}

function pickPhoto(key){
  photoTarget = key;
  var inp = document.getElementById("filein");
  inp.value = "";
  inp.click();
}

function photoCaptureSummary(batch){
  var total = batch.files.length;
  var added = batch.durableCount;
  if(!added){
    return total === 1 ? "Could not add that photo." : "Could not add those photos.";
  }
  var message = added === 1 ? "Photo added." : added + " photos added.";
  if(added !== total){
    message = added + " of " + total + " photos added.";
  }
  if(batch.failed){
    message += " " + batch.failed + " could not be processed.";
  }
  var notPersisted = batch.added.length - batch.durableCount;
  if(notPersisted){
    message += " " + notPersisted + " could not be added to the survey.";
  }
  if(batch.inlineFallbacks){
    message += " " + batch.inlineFallbacks +
      (batch.inlineFallbacks === 1 ? " is" : " are") +
      " stored in the survey file rather than device storage.";
  }
  if(batch.finalPersistFailed){
    message += " Survey storage is full - prepare the visit package now.";
  }
  return message;
}

function descriptorFromPhotoRecord(record){
  if(!record || !record.blob) throw new Error("Photo storage returned no record");
  var descriptor = {
    id:record.id,
    mime:String(record.mime || "").toLowerCase(),
    bytes:record.bytes,
    width:record.width,
    height:record.height
  };
  if(!isPhotoDescriptor(descriptor)) throw new Error("Photo storage returned an invalid record");
  return descriptor;
}

function persistCaptureItem(batch, item, kind){
  item.index = photoList(batch.key).indexOf(item.source);
  batch.added.push(item);
  var persisted = persistSurvey();
  if(persisted){
    batch.durableCount = batch.added.length;
  } else {
    rememberPhotoCaptureFailure(batch.key,item,kind);
  }
  return persisted;
}

function appendInlineCapture(batch, dataUrl){
  if(!S.photos[batch.key]) S.photos[batch.key] = [];
  var list = photoList(batch.key);
  var item = {index:list.length,source:dataUrl};
  list.push(dataUrl);
  batch.inlineFallbacks++;
  persistCaptureItem(batch,item,"memory-only");
}

function fallBackAfterStoredRecord(batch, descriptor, dataUrl, error){
  var list = photoList(batch.key);
  var index = list.indexOf(descriptor);
  if(index > -1) list.splice(index,1);
  delete missingPhotoIds[descriptor.id];
  rememberOrphanedPhotoId(descriptor.id);
  batch.storageDegraded = true;
  batch.orphans++;
  setPhotoStoreFailure("verify",error);
  if(index < 0 || index > list.length) index = list.length;
  list.splice(index,0,dataUrl);
  batch.inlineFallbacks++;
  persistCaptureItem(batch,{index:index,source:dataUrl},"memory-only");
}

function storeCapturedPhoto(batch, dataUrl, dimensions){
  if(batch.storageDegraded){
    appendInlineCapture(batch,dataUrl);
    return Promise.resolve();
  }
  if(!window.AVLPhotoStore || typeof window.AVLPhotoStore.addDataUrl !== "function"){
    batch.storageDegraded = true;
    setPhotoStoreFailure("add",new Error("Photo storage is unavailable"));
    appendInlineCapture(batch,dataUrl);
    return Promise.resolve();
  }

  var write;
  try {
    write = window.AVLPhotoStore.addDataUrl(
      dataUrl,
      dimensions && dimensions.width,
      dimensions && dimensions.height
    );
  } catch(error){
    write = Promise.reject(error);
  }

  return Promise.resolve(write).then(function(record){
    var descriptor;
    try { descriptor = descriptorFromPhotoRecord(record); }
    catch(error){
      batch.storageDegraded = true;
      batch.orphans++;
      if(record && record.id) rememberOrphanedPhotoId(record.id);
      setPhotoStoreFailure("verify",error);
      appendInlineCapture(batch,dataUrl);
      return;
    }
    if(!S.photos[batch.key]) S.photos[batch.key] = [];
    var list = photoList(batch.key);
    var index = list.length;
    list.push(descriptor);
    return hydratePhotoSource(batch.key,index).then(function(){
      var liveIndex = list.indexOf(descriptor);
      if(liveIndex < 0) throw new Error("Photo changed during storage verification");
      persistCaptureItem(batch,{index:liveIndex,source:descriptor},"unreferenced");
    }).catch(function(error){
      fallBackAfterStoredRecord(batch,descriptor,dataUrl,error);
    });
  },function(error){
    batch.storageDegraded = true;
    setPhotoStoreFailure("add",error);
    appendInlineCapture(batch,dataUrl);
  });
}

function processPhotoBatch(key, files, compressor){
  var batch = {
    key:String(key),
    files:Array.prototype.slice.call(files || []),
    index:0,
    added:[],
    durableCount:0,
    failed:0,
    inlineFallbacks:0,
    storageDegraded:false,
    orphans:0,
    finalPersistFailed:false
  };
  var runCompressor = compressor || compress;
  if(saveTimer){
    clearTimeout(saveTimer);
    saveTimer = null;
    photoCaptureSaveSuppressed = true;
  }
  photoCaptureCritical = true;
  photoCapturePendingCount = batch.files.length;

  function next(){
    if(batch.index >= batch.files.length){
      photoCaptureCritical = false;
      photoCapturePendingCount = 0;
      if(photoCaptureSaveSuppressed){
        photoCaptureSaveSuppressed = false;
        if(batch.added.length){
          if(persistSurvey()){
            batch.durableCount = batch.added.length;
          } else {
            batch.finalPersistFailed = true;
          }
        } else {
          save();
        }
      }
      if(batch.added.length) render();
      toast(photoCaptureSummary(batch));
      return Promise.resolve({
        total:batch.files.length,
        added:batch.durableCount,
        captured:batch.added.length,
        failed:batch.failed,
        inlineFallbacks:batch.inlineFallbacks,
        orphans:batch.orphans,
        persisted:batch.durableCount === batch.added.length
      });
    }

    var file = batch.files[batch.index++];
    return new Promise(function(resolve){
      var settled = false;
      var guard = setTimeout(function(){
        finish(null,true);
      },photoCompressTimeoutMs);
      function finish(value,failed){
        if(settled) return;
        settled = true;
        clearTimeout(guard);
        if(failed) batch.failed++;
        resolve(value);
      }
      try {
        runCompressor(file, function(dataUrl, dimensions){
          if(dataUrl){
            finish({dataUrl:dataUrl,dimensions:dimensions},false);
          } else {
            finish(null,true);
          }
        });
      } catch(error){
        finish(null,true);
      }
    }).then(function(result){
      if(!result) return;
      return storeCapturedPhoto(batch,result.dataUrl,result.dimensions);
    }).then(function(){
      photoCapturePendingCount = Math.max(0,photoCapturePendingCount - 1);
      return next();
    });
  }

  return next().catch(function(error){
    photoCaptureCritical = false;
    photoCapturePendingCount = 0;
    if(photoCaptureSaveSuppressed){
      photoCaptureSaveSuppressed = false;
      save();
    }
    throw error;
  });
}

function queuePhotoBatch(key, files, compressor){
  var run = function(){ return processPhotoBatch(key,files,compressor); };
  /* The shared flight must never latch rejected. A failed batch cannot
     disable every capture that follows it. */
  var result = photoCaptureFlight.then(run,run);
  photoCaptureFlight = result.catch(function(){});
  return result;
}

function photoCaptureIdle(){
  return photoCaptureFlight.then(function(){});
}

document.getElementById("filein").addEventListener("change", function(e){
  var files = Array.prototype.slice.call(e.target.files || []);
  if(!files.length || !photoTarget) return;
  queuePhotoBatch(photoTarget,files);
});

function compress(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 900;
      var scale = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      try {
        cb(c.toDataURL("image/jpeg", 0.62), {width:c.width, height:c.height});
      } catch(err){ cb(null); }
    };
    img.onerror = function(){ cb(null); };
    img.src = reader.result;
  };
  reader.onerror = function(){ cb(null); };
  reader.readAsDataURL(file);
}

function slug(){

  var d = S.visit.date || "";

function portablePhotoValid(value){
  if(!value || typeof value !== "object" || Array.isArray(value)) return false;
  if(typeof value.mime !== "string" || !value.mime) return false;
  if(typeof value.data !== "string") return false;
  var fields = ["bytes","width","height"];
  for(var i=0;i<fields.length;i++){
    var n = value[fields[i]];
    if(typeof n !== "number" || !isFinite(n) || n < 0 || Math.floor(n) !== n) return false;
  }
  try {
    var decoded = decodeDataUrl(value.data);
    return decoded.mime === value.mime.toLowerCase() && decoded.bytes.length === value.bytes;
  } catch(error){
    return false;
  }
}
function portableImportState(payload, useDescriptors){
  if(!payload || payload.app !== "avl-survey" || payload.schema !== 3 ||
     payload.photoFormat !== "inline" || !payload.data || typeof payload.data !== "object"){
    return Promise.reject(new Error("This file lists photos that are stored on another device. Import a full PrePlot package from that device."));
  }
  var sourcePhotos = payload.data.photos || {};
  if(!sourcePhotos || typeof sourcePhotos !== "object" || Array.isArray(sourcePhotos)){
    return Promise.reject(new Error("Portable photo data is malformed"));
  }
  var data = JSON.parse(JSON.stringify({
    visit:payload.data.visit,
    log:payload.data.log,
    rooms:payload.data.rooms,
    photos:{},
    skipped:payload.data.skipped,
    ui:payload.data.ui,
    meta:payload.data.meta
  }));
  var jobs = [];
  var coverJob = null;
  var incomingCover = data.visit && data.visit.coverPhotoId;
  if(data.visit) data.visit.coverPhotoId = "";
  var keys = Object.keys(sourcePhotos);
  for(var k=0;k<keys.length;k++){
    var list = sourcePhotos[keys[k]];
    if(!Array.isArray(list)) return Promise.reject(new Error("Portable photo data is malformed"));
    data.photos[keys[k]] = [];
    for(var i=0;i<list.length;i++){
      if(!portablePhotoValid(list[i])){
        return Promise.reject(new Error("Portable photo data is malformed"));
      }
      var job = {key:keys[k], value:list[i]};
      if(list[i].cover === true || (incomingCover && incomingCover === list[i].data)){
        if(coverJob) return Promise.reject(new Error("Portable photo data has more than one cover"));
        coverJob = job;
      }
      jobs.push(job);
    }
  }
  var baseValidation = validate(data);
  if(!baseValidation.ok) return Promise.reject(new Error(baseValidation.reason));
  if(!useDescriptors){
    jobs.forEach(function(job){ data.photos[job.key].push(job.value.data); });
    if(coverJob) data.visit.coverPhotoId = coverJob.value.data;
    return Promise.resolve(coerce(data));
  }

  var records = [];
  var probeId = "";
  var chain = Promise.resolve();
  function verifyPortableRecord(record,job){
    var descriptor = descriptorFromPhotoRecord(record);
    if(record.blob.size !== descriptor.bytes ||
       descriptor.bytes !== job.value.bytes ||
       descriptor.mime !== job.value.mime.toLowerCase()){
      throw new Error("Photo storage verification failed");
    }
    return record;
  }
  if(jobs.length){
    chain = chain.then(function(){
      if(!window.AVLPhotoStore ||
         typeof window.AVLPhotoStore.addDataUrl !== "function" ||
         typeof window.AVLPhotoStore.get !== "function" ||
         (jobs.length > 1 && typeof window.AVLPhotoStore.addDataUrls !== "function")){
        throw new Error("Photo storage is unavailable");
      }
      return window.AVLPhotoStore.addDataUrl(
        jobs[0].value.data,
        jobs[0].value.width,
        jobs[0].value.height
      );
    }).then(function(record){
      if(record && record.id) probeId = record.id;
      verifyPortableRecord(record,jobs[0]);
      var read;
      try { read = window.AVLPhotoStore.get(probeId); }
      catch(error){ read = Promise.reject(error); }
      return Promise.resolve(read);
    }).then(function(record){
      if(!record || record.id !== probeId) throw new Error("Photo storage verification failed");
      verifyPortableRecord(record,jobs[0]);
      records.push({job:jobs[0],record:record});
      if(jobs.length === 1) return [];
      return window.AVLPhotoStore.addDataUrls(jobs.slice(1).map(function(job){
        return {
          data:job.value.data,
          width:job.value.width,
          height:job.value.height
        };
      }));
    }).then(function(batchRecords){
      if(!Array.isArray(batchRecords) || batchRecords.length !== Math.max(0,jobs.length - 1)){
        throw new Error("Photo storage verification failed");
      }
      batchRecords.forEach(function(record,index){
        records.push({job:jobs[index + 1],record:record});
      });
    });
  }
  return chain.then(function(){
    var seen = {};
    records.forEach(function(item){
      var descriptor = descriptorFromPhotoRecord(verifyPortableRecord(item.record,item.job));
      if(seen[descriptor.id]) throw new Error("Photo storage returned a duplicate id");
      seen[descriptor.id] = true;
      data.photos[item.job.key].push(descriptor);
      if(item.job === coverJob) data.visit.coverPhotoId = descriptor.id;
    });
    var result = validate(data);
    if(!result.ok) throw new Error(result.reason);
    return coerce(data);
  }).catch(function(){
    if(probeId) rememberOrphanedPhotoId(probeId);
    records.forEach(function(item){
      if(item.record && item.record.id) rememberOrphanedPhotoId(item.record.id);
    });
    Object.keys(data.photos).forEach(function(key){ data.photos[key] = []; });
    jobs.forEach(function(job){ data.photos[job.key].push(job.value.data); });
    if(coverJob) data.visit.coverPhotoId = coverJob.value.data;
    return coerce(data);
  });
}
function packagePhotoEntryValid(value){
  if(!value || typeof value !== "object" || Array.isArray(value)) return false;
  if(typeof value.ref !== "string" || !/^\d+$/.test(value.ref)) return false;
  if(typeof value.filename !== "string" || !value.filename ||
     value.filename.indexOf("/") > -1 || value.filename.indexOf("\\") > -1) return false;
  if(value.path !== "photos/" + value.filename) return false;
  if(typeof value.mime !== "string" || !value.mime) return false;
  var numeric = ["bytes","width","height"];
  for(var i=0;i<numeric.length;i++){
    var number = value[numeric[i]];
    if(typeof number !== "number" || !isFinite(number) || number < 0 ||
       Math.floor(number) !== number) return false;
  }
  var dot = value.filename.lastIndexOf(".");
  if(dot < 1 || photoExtension(value.mime.toLowerCase()) !==
     value.filename.slice(dot+1).toLowerCase()) return false;
  return true;
}
function packageImportPreflight(input){
  var archive = zipReadStore(input);
  var jsonName = archive.root + "/data/survey-export.json";
  var jsonEntry = archive.entries[jsonName];
  if(!jsonEntry) throw new Error("Package survey data is missing");
  var payload;
  try { payload = JSON.parse(bytesText(jsonEntry.bytes)); }
  catch(error){ throw new Error("Package survey data is not valid JSON"); }
  if(!payload || payload.app !== "avl-survey" || payload.schema !== 3 ||
     payload.photoFormat !== "archive" || payload.pathBase !== "archive-root" ||
     !payload.data || typeof payload.data !== "object"){
    throw new Error("This is not a supported PrePlot package");
  }
  if(typeof payload.coverPhoto !== "undefined" &&
     typeof payload.coverPhoto !== "string"){
    throw new Error("Package cover reference is malformed");
  }
  var sourcePhotos = payload.data.photos;
  if(!sourcePhotos || typeof sourcePhotos !== "object" || Array.isArray(sourcePhotos)){
    throw new Error("Package photo data is malformed");
  }
  var data = JSON.parse(JSON.stringify({
    visit:payload.data.visit,
    log:payload.data.log,
    rooms:payload.data.rooms,
    photos:{},
    skipped:payload.data.skipped,
    ui:payload.data.ui,
    meta:payload.data.meta
  }));
  data.visit = data.visit || {};
  data.visit.coverPhotoId = "";
  var jobs = [];
  var declaredPaths = Object.create(null);
  Object.keys(sourcePhotos).forEach(function(key){
    var list = sourcePhotos[key];
    if(!Array.isArray(list)) throw new Error("Package photo data is malformed");
    data.photos[key] = [];
    list.forEach(function(item,index){
      if(!packagePhotoEntryValid(item)){
        throw new Error("Package photo data is malformed");
      }
      var fullPath = archive.root + "/" + item.path;
      if(declaredPaths[fullPath]) throw new Error("Package declares a duplicate photo");
      declaredPaths[fullPath] = true;
      var stored = archive.entries[fullPath];
      if(!stored) throw new Error("Package photo is missing: " + item.filename);
      if(stored.bytes.length !== item.bytes){
        throw new Error("Package photo size does not match its manifest");
      }
      jobs.push({
        key:key,
        bucketIndex:index,
        item:item,
        bytes:stored.bytes
      });
    });
  });
  archive.names.forEach(function(name){
    if(name.indexOf(archive.root + "/photos/") !== 0) return;
    if(!declaredPaths[name]) throw new Error("Package contains an undeclared photo");
  });
  jobs.sort(function(a,b){
    return parseInt(a.item.ref,10) - parseInt(b.item.ref,10);
  });
  var refWidth = Math.max(3,String(jobs.length).length);
  var filenames = Object.create(null);
  jobs.forEach(function(job,index){
    if(job.item.ref !== photoPad(index+1,refWidth)){
      throw new Error("Package photo order is inconsistent");
    }
    if(filenames[job.item.filename]){
      throw new Error("Package photo filename is duplicated");
    }
    filenames[job.item.filename] = true;
  });
  var coverFilename = payload.coverPhoto || "";
  var coverJob = null;
  if(coverFilename){
    jobs.forEach(function(job){
      if(job.item.filename === coverFilename) coverJob = job;
    });
    if(!coverJob) throw new Error("Package cover photo is missing");
  }
  var baseValidation = validate(data);
  if(!baseValidation.ok) throw new Error(baseValidation.reason);
  return {
    archive:archive,
    data:data,
    jobs:jobs,
    coverJob:coverJob
  };
}
function packageBytesEqual(left,right){
  if(left.length !== right.length) return false;
  for(var i=0;i<left.length;i++){
    if(left[i] !== right[i]) return false;
  }
  return true;
}
function applyPackageImport(input){
  var prepared;
  try { prepared = packageImportPreflight(input); }
  catch(error){
    toast("Not imported: " + (error && error.message ? error.message : "package preflight failed"));
    return Promise.resolve(false);
  }
  var written = [];
  var chain = Promise.resolve();
  if(prepared.jobs.length && (!window.AVLPhotoStore ||
     typeof window.AVLPhotoStore.createId !== "function" ||
     typeof window.AVLPhotoStore.addRecord !== "function" ||
     typeof window.AVLPhotoStore.get !== "function")){
    toast("Not imported: Photo storage is unavailable");
    return Promise.resolve(false);
  }
  prepared.jobs.forEach(function(job){
    chain = chain.then(function(){
      var record = {
        id:window.AVLPhotoStore.createId(),
        mime:job.item.mime.toLowerCase(),
        blob:new Blob([job.bytes],{type:job.item.mime.toLowerCase()}),
        width:job.item.width,
        height:job.item.height,
        bytes:job.bytes.length,
        createdAt:nowISO()
      };
      return window.AVLPhotoStore.addRecord(record).then(function(){
        written.push(record.id);
        return window.AVLPhotoStore.get(record.id);
      }).then(function(readback){
        var descriptor = descriptorFromPhotoRecord(readback);
        if(descriptor.mime !== job.item.mime.toLowerCase() ||
           descriptor.bytes !== job.item.bytes ||
           descriptor.width !== job.item.width ||
           descriptor.height !== job.item.height ||
           !readback.blob || readback.blob.size !== job.item.bytes){
          throw new Error("Photo storage verification failed");
        }
        return readback.blob.arrayBuffer().then(function(buffer){
          if(!packageBytesEqual(new Uint8Array(buffer),job.bytes)){
            throw new Error("Photo storage verification failed");
          }
          job.record = readback;
        });
      });
    });
  });
  return chain.then(function(){
    prepared.jobs.forEach(function(job){
      prepared.data.photos[job.key][job.bucketIndex] =
        descriptorFromPhotoRecord(job.record);
      if(job === prepared.coverJob){
        prepared.data.visit.coverPhotoId = job.record.id;
      }
    });
    var result = validate(prepared.data);
    if(!result.ok) throw new Error(result.reason);
    var applied = applyPreparedImport(coerce(prepared.data),3);
    if(!applied){
      written.forEach(rememberOrphanedPhotoId);
      return false;
    }
    return true;
  }).catch(function(error){
    written.forEach(rememberOrphanedPhotoId);
    toast("Not imported: " + (error && error.message ? error.message : "package import failed"));
    return false;
  });
}
function applyPreparedImport(incoming, from){
  var rooms = incoming.rooms.length;
  var hadWork = hasSurveyWork();
  if(hadWork && !snapshot()){
    toast("Could not back up current survey — import cancelled");
    return false;
  }
  revokeAllPhotoAssets();
  photoCaptureRecoveries = [];
  S = incoming;
  reseq();
  save();
  render();
  refreshPhotoIntegrity();
  toast("Imported " + rooms + (rooms === 1 ? " room" : " rooms") +
    (from < SCHEMA ? " (upgraded from v" + from + ")" : "") +
    (hadWork ? " — previous survey backed up" : ""));
  return true;
}

  return portableImportState(payload,!!useDescriptors).then(function(incoming){
    return applyPreparedImport(incoming,3);
  }).catch(function(error){
    toast("Not imported: " + (error && error.message ? error.message : "portable import failed"));
    return false;
  });
}

/* Import is the most dangerous operation in the app: it overwrites everything.
   Parse, migrate, validate, snapshot, then apply. */
function applyImport(text){
  var parsed;
  try { parsed = JSON.parse(text); }
  catch(e){ toast("That file isn't valid JSON"); return false; }

  if(parsed && parsed.app === "avl-survey" && parsed.schema === 3){
    if(parsed.photoFormat === "archive"){
      toast("Not imported: this is the survey file from inside a package. Import the complete .zip package instead.");
      return false;
    }
    if(parsed.photoFormat !== "inline"){
      toast("Not imported: This file lists photos that are stored on another device. Import a full PrePlot package from that device.");
      return false;
    }
    return applyPortableImport(parsed,true);
  }

  var res = migrate(parsed);
  if(!res.ok){ toast("Not imported: " + res.reason); return false; }
  if(stateHasPhotoDescriptors(res.data)){
    toast("Not imported: This file lists photos that are stored on another device. Import a full PrePlot package from that device.");
    return false;
  }

  return applyPreparedImport(res.data,res.from);
}

function restoreBackup(){
  var raw = store.get(BACKUP_KEY);
  if(!raw){ toast("No backup available"); return false; }
  var current = JSON.stringify(envelope());
  var parsed;
  try { parsed = JSON.parse(raw); }
  catch(error){ toast("Backup is unreadable"); return false; }
  var restored = migrate(parsed);
  if(!restored.ok){ toast("Backup not restored: " + restored.reason); return false; }
  if(!applyPreparedImport(restored.data,restored.from)) return false;
  store.set(BACKUP_KEY, current);
  render();
  return true;
}

document.getElementById("jsonin").addEventListener("change", function(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    var bytes = new Uint8Array(r.result);
    if(bytes.length >= 4 && read32(bytes,0) === 0x04034b50){
      applyPackageImport(bytes);
      return;
    }
    var text;
    try { text = bytesText(bytes); }
    catch(error){ toast("Could not read that file"); return; }
    if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    applyImport(text);
  };
  r.onerror = function(){ toast("Could not read that file"); };
  r.readAsArrayBuffer(f);
  e.target.value = "";
});

function pdfTableRowLayout(row,w){
  var labelW = Math.min(150,w * 0.46);
  var labelLines = pdfWrapLines(row.label,7.5,true,labelW-14,0).slice(0,2);
  var valueX = labelW + 8;
  var valueLines = pdfWrapLines(row.value,8.5,false,w-valueX-7,0).slice(0,2);
  return {
    labelW:labelW,

function stripedTable(page,x,y,w,rows){
  var top = y;
  rows.forEach(function(row,index){
    var layout = pdfTableRowLayout(row,w);
    var rowH = layout.height;
    if(index % 2 === 0) pdfFillRect(page,x,top,w,rowH,PDF_COLORS.card);
    layout.labelLines.forEach(function(line,lineIndex){
      pdfDrawText(page,line,x+7,top+5+lineIndex*10,7.5,true,PDF_COLORS.muted);
    });
    layout.valueLines.forEach(function(line,lineIndex){

    });

function reportRowsHeight(rows,start,end,w){
  var height = 0;
  for(var index=start;index<end;index++){
    height += pdfTableRowLayout(rows[index],w).height;
  }
  return height;
}
function reportTakeTableColumns(rows,start,w,maxHeight){
  var bestEnd = start;
  var bestSplit = start;
  var bestDifference = Infinity;
  for(var end=start+1;end<=rows.length;end++){
    var found = false;
    var candidateSplit = start;
    var candidateDifference = Infinity;
    for(var split=start+1;split<=end;split++){
      var leftHeight = reportRowsHeight(rows,start,split,w);
      var rightHeight = reportRowsHeight(rows,split,end,w);
      if(leftHeight > maxHeight || rightHeight > maxHeight) continue;
      var difference = Math.abs(leftHeight-rightHeight);
      if(difference < candidateDifference){
        candidateDifference = difference;
        candidateSplit = split;
        found = true;
      }
    }
    if(!found) break;
    bestEnd = end;
    bestSplit = candidateSplit;
    bestDifference = candidateDifference;
  }
  return {
    left:rows.slice(start,bestSplit),
    right:rows.slice(bestSplit,bestEnd),
    next:bestEnd,
    height:Math.max(
      reportRowsHeight(rows,start,bestSplit,w),
      reportRowsHeight(rows,bestSplit,bestEnd,w)
    ),
    difference:bestDifference
  };
}

function reportBasis(data){
  var atDisplay = num(data.lux_disp);
  var measured = [atDisplay,num(data.lux_mid),num(data.lux_rear)].filter(function(value){
    return value !== null;
  });
  if(atDisplay !== null){
    return {value:atDisplay,label:"at display wall"};
  }
  if(measured.length){
    return {value:Math.max.apply(null,measured),label:"highest measured"};
  }
  var preset = num(data.lux_preset);
  return preset === null ? null : {value:preset,label:"estimated"};
}
function reportDimensionTiles(room){
  var data = room.d || {};
  var fields = [
    {key:"len",label:"Length",suffix:" ft",qualifier:"overall"},
    {key:"wid",label:"Width",suffix:" ft",qualifier:"overall"},
    {key:"hgt",label:"Ceiling",suffix:" ft",qualifier:"to ceiling grid"},
    {key:"seats",label:"Seats",suffix:"",qualifier:"occupancy"}
  ];
  return fields.filter(function(field){ return answered(data[field.key]); }).map(function(field){
    return {
      label:field.label,
      value:disp(data[field.key]) + field.suffix,
      qualifier:field.qualifier
    };
  });
}
function reportLightTiles(room){
  var data = room.d || {};
  var tiles = [];
  LIGHT_FIELDS.filter(function(field){
    return field.reportTileKind === "measured";
  }).forEach(function(field){
    if(answered(data[field.k])){
      tiles.push({
        label:field.reportTileLabel,
        value:Math.round(num(data[field.k])) + " lux",
        qualifier:"measured"
      });
    }
  });
  if(!tiles.length && answered(data.lux_preset)){
    var presetField = lightFields(["lux_preset"])[0];
    tiles.push({
      label:presetField.reportTileLabel,
      value:"~" + Math.round(num(data.lux_preset)) + " lux",
      qualifier:"estimated, no meter"
    });
  }
  var basis = reportBasis(data);
  if(basis){
    var value;
    if(data.disptype === "Projection"){
      var lumens = recLumens(basis.value,num(data.scr_diag),num(data.scr_gain) || 1);
      value = lumens ? lumens.toLocaleString() + " lm" : targetFL(basis.value) + " fL";
    } else {
      value = recNits(basis.value) + " nits";
    }
    tiles.push({
      label:"Recommendation",
      value:value,
      qualifier:"from " + Math.round(basis.value) + " lux " + basis.label
    });
  }
  return tiles.slice(0,4);
}
function reportFieldRows(room){
  var data = room.d || {};
  var omit = {
    name:true,seats:true,len:true,wid:true,hgt:true,
    lux_disp:true,lux_mid:true,lux_rear:true,lux_preset:true,
    inv:true,reuse:true,remov:true,ctrl:true,lightctl:true,oper:true,
    flags:true,open:true,gen:true
  };
  var rows = [];
  /* Fields handled as stats/cards belong in omit above. LIGHT_FIELDS owns its
     custom report labels so the PDF and CRM note cannot silently diverge. */
  LIGHT_FIELDS.filter(function(field){
    return !!field.reportLabel;
  }).forEach(function(field){
    if(answered(data[field.k])){
      rows.push({label:field.reportLabel,value:disp(data[field.k])});
    }
  });
  ROOM_SECTIONS.forEach(function(section){
    if(section.special || section.id === "exist" || section.id === "notes") return;
    section.fields.forEach(function(field){
      if(omit[field.k] || !answered(data[field.k])) return;
      var note = data[field.k + "_note"];
      rows.push({
        label:section.title + " \u00b7 " + field.l,
        value:disp(data[field.k]) + (answered(note) ? " \u2014 " + disp(note) : "")
      });
    });
  });
  return rows;
}
function reportEquipmentColumns(room){
  var data = room.d || {};
  function collect(fields){
    return fields.filter(function(field){ return answered(data[field.key]); }).map(function(field){
      return {label:field.label,value:disp(data[field.key])};
    });
  }
  return {
    equipment:collect([
      {key:"inv",label:"Inventory"},
      {key:"reuse",label:"Reuse"},
      {key:"remov",label:"Removal"}
    ]),
    control:collect([
      {key:"ctrl",label:"Interface"},
      {key:"lightctl",label:"Lighting control"},
      {key:"oper",label:"Operator"}
    ])
  };
}
function reportOverviewItems(){

    if(answered(value)) items.push({title:title,body:disp(value)});
  }
  add("Scope as understood on arrival",S.visit.scope);
  add("Site logistics",S.log.lognote);
  LOGISTICS.forEach(function(field){
    if(S.log[field.k] === "issue"){
      add(field.l,S.log[field.k+"_note"] || "Marked as an issue during the visit.");
    }
  });
  S.rooms.forEach(function(room){
    var name = (room.d && room.d.name) || ("Room " + room.id);
    add(name + " \u00b7 Red flags",room.d.flags);
    add(name + " \u00b7 Open questions",room.d.open);
    add(name + " \u00b7 Notes",room.d.gen);
    ROOM_SECTIONS.forEach(function(section){
      section.fields.forEach(function(field){
        if(room.d[field.k] === "issue"){
          add(name + " \u00b7 " + field.l,
            room.d[field.k+"_note"] || "Marked as an issue during the visit.");
        }
      });
    });
  });

function disp(v){

  if(v === "ok") return "OK";
  if(v === "issue") return "ISSUE";

function pdfRenditionFromBlob(blob){
  return new Promise(function(resolve,reject){
    var reader = new FileReader();
    var image = new Image();
    image.onload = function(){
      var sourceW = image.naturalWidth || image.width;
      var sourceH = image.naturalHeight || image.height;
      var scale = Math.min(1,600 / Math.max(sourceW,sourceH));
      var width = Math.max(1,Math.round(sourceW * scale));
      var height = Math.max(1,Math.round(sourceH * scale));
      var canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      var context = canvas.getContext("2d");
      context.drawImage(image,0,0,width,height);
      image.removeAttribute("src");
      canvas.toBlob(function(jpeg){
        canvas.width = 1;
        canvas.height = 1;
        if(!jpeg){ reject(new Error("PDF rendition failed")); return; }
        jpeg.arrayBuffer().then(function(buffer){
          var bytes = new Uint8Array(buffer);
          var dimensions = pdfJpegDimensions(bytes);
          resolve({
            bytes:bytes,
            width:dimensions.width,
            height:dimensions.height,
            mime:"image/jpeg"
          });
        },reject);
      },"image/jpeg",0.6);
    };
    image.onerror = function(){
      reject(new Error("PDF photo could not be decoded"));
    };
    reader.onload = function(){ image.src = String(reader.result); };
    reader.onerror = function(){ reject(reader.error || new Error("PDF photo could not be read")); };
    try { reader.readAsDataURL(blob); }
    catch(error){ reject(error); }
  });
}
function preparePdfRenditions(manifest,sourceProvider,onProgress){
  var images = [];
  var index = 0;
  function next(){
    if(index >= manifest.length) return Promise.resolve(images);
    var current = index;
    if(onProgress) onProgress(current+1,manifest.length);
    return Promise.resolve(sourceProvider(manifest[current],current)).then(function(source){
      var blob = source && source.blob
        ? source.blob
        : new Blob([source.bytes],{type:source.mime || manifest[current].mime});
      return pdfRenditionFromBlob(blob);
    }).then(function(image){
      images.push(image);
      index++;
      return new Promise(function(resolve){ setTimeout(resolve,0); }).then(next);
    });
  }
  return next();
}
function assemblePdfReportModel(reportModel,images){
  var documentModel = buildReportDocument(reportModel,images);
  var bytes = pdfWriteDocument(documentModel);
  var layout = documentModel.layout;
  var renditionDimensions = images.map(function(image){
    return {width:image.width,height:image.height,bytes:image.bytes.length};
  });
  var pages = documentModel.pages.map(function(page){
    return {kind:page.kind,width:page.width,height:page.height};
  });
  documentModel.images = [];
  images.length = 0;
  return {
    bytes:bytes,
    layout:layout,
    pages:pages,
    renditionDimensions:renditionDimensions,
    title:documentModel.title,
    renditionsReleased:images.length === 0
  };
}
function assemblePdfReport(manifest,images){
  return assemblePdfReportModel(buildReportModel(manifest),images);
}
function generatePdfReport(manifest,onProgress){
  var list = manifest || photoManifest();
  return preparePdfRenditions(list,function(entry){
    return hydratePhotoSource(entry.key,entry.bucketIndex);
  },onProgress).then(function(images){
    return assemblePdfReport(list,images);
  });
}

/* ---- offline service worker ---- */
var swApplyingUpdate = false;
var swUpdateDismissed = false;
var swUpdateCheckRunning = false;
var swUpdateCheckQueued = false;

function showUpdateNotice(reg){
  if(!reg || !reg.waiting || swUpdateDismissed) return;
  if(document.getElementById("swUpdateNotice")) return;

  var host = document.getElementById("systemNotices");
  if(!host) return;

  var bar = document.createElement("div");
  bar.className = "sysnotice";
  bar.id = "swUpdateNotice";
  bar.setAttribute("role","status");

  var msg = document.createElement("span");
  msg.className = "msg";
  msg.innerHTML = "<b>Update ready.</b> Apply it now or keep working and update later.";

  var later = document.createElement("button");
  later.type = "button";
  later.id = "swUpdateLater";
  later.textContent = "Later";
  later.onclick = function(){
    swUpdateDismissed = true;
    if(bar.parentNode) bar.parentNode.removeChild(bar);
  };

  var apply = document.createElement("button");
  apply.type = "button";
  apply.className = "pri";
  apply.id = "swUpdateNow";
  apply.textContent = "Update";
  apply.onclick = function(){
    if(!reg.waiting) return;
    swApplyingUpdate = true;
    apply.disabled = true;
    later.disabled = true;
    apply.textContent = "Updating...";
    reg.waiting.postMessage({type:"SKIP_WAITING"});
  };

  bar.appendChild(msg);
  bar.appendChild(later);
  bar.appendChild(apply);
  host.appendChild(bar);
}

function watchForUpdate(reg){
  if(reg.waiting) showUpdateNotice(reg);
  reg.addEventListener("updatefound", function(){
    var worker = reg.installing;
    if(!worker) return;
    worker.addEventListener("statechange", function(){
      if(worker.state === "installed" && navigator.serviceWorker.controller){
        showUpdateNotice(reg);
      }
    });
  });
}

function checkForUpdate(reg){
  if(swUpdateCheckRunning){
    swUpdateCheckQueued = true;
    return Promise.resolve();
  }

  swUpdateCheckRunning = true;
  return reg.update()
    .catch(function(){ /* update check unavailable — cached app still works */ })
    .then(function(){
      swUpdateCheckRunning = false;
      if(swUpdateCheckQueued){
        swUpdateCheckQueued = false;
        return checkForUpdate(reg);
      }
    });
}

if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(!swApplyingUpdate) return;
    swApplyingUpdate = false;
    window.location.reload();
  });

  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js", {updateViaCache:"none"}).then(function(reg){
      watchForUpdate(reg);
      window.addEventListener("focus", function(){ checkForUpdate(reg); });
      document.addEventListener("visibilitychange", function(){
        if(document.visibilityState === "visible"){
          checkForUpdate(reg);
          refreshStorageEstimate();
        }
      });
      checkForUpdate(reg).then(function(){
        if(window.__avl) window.__avl.swReady = true;
      });
    }).catch(function(){ /* offline caching unavailable — app still runs */ });
  });
}
