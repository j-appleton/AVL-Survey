   PHOTOS
   ============================================================ */
var photoTarget = null;
var photoStoreLastError = "";
var photoStoreFailureKind = "";
var photoCaptureFlight = Promise.resolve();
var photoCapturePendingCount = 0;
var photoCompressTimeoutMs = 15000;
var orphanedPhotoIds = [];

function rememberOrphanedPhotoId(id){
  id = String(id || "");
  if(id && orphanedPhotoIds.indexOf(id) < 0) orphanedPhotoIds.push(id);
}

function activePhotoCaptureRecoveries(key){
  var list = photoList(key);
  return photoCaptureRecoveries.filter(function(item){
    return item.key === String(key) &&
      item.index >= 0 &&
      item.index < list.length &&
      list[item.index] === item.source;
  });
}

function photoCaptureRecoveryHTML(key){
  var items = activePhotoCaptureRecoveries(key);
  if(!items.length) return "";
  var count = items.length;
  var memoryOnly = items.filter(function(item){ return item.kind === "memory-only"; }).length;
  var unreferenced = count - memoryOnly;
  var message;
  if(count === 1 && memoryOnly){
    message = "1 photo is available now but could not be added to the survey. " +
      "Closing this page will lose it. Save it before leaving this page.";
  } else if(count === 1){
    message = "1 photo is in device storage but could not be added to the survey. " +
      "Export or save it before leaving this page.";
  } else {
    message = count + " photos could not be added to the survey.";
    if(memoryOnly){
      message += " " + memoryOnly + (memoryOnly === 1 ? " is" : " are") +
        " available only until this page closes.";
    }
    if(unreferenced){
      message += " " + unreferenced + (unreferenced === 1 ? " is" : " are") +
        " in device storage without a persisted survey reference.";
    }
    message += " Export or save them before leaving this page.";
  }
  return '<div class="flag bad phrecovery" role="alert" data-photo-recovery="'+esc(key)+'">' +
    '<div>'+esc(message)+'</div>' +
    '<div class="phrecovery-actions">' +
      items.map(function(item){
        return '<button type="button" class="btn sm" data-recoverph data-photo-key="'+esc(key)+
          '" data-photo-index="'+item.index+'">Save photo '+(item.index + 1)+'\u2026</button>';
      }).join("") +
    '</div></div>';
}

function rememberPhotoCaptureFailure(key, item, kind){
  photoCaptureRecoveries.push({
    key:String(key),
    index:item.index,
    source:item.source,
    kind:kind
  });
}

function adjustPhotoCaptureRecoveriesAfterDelete(key, index){
  photoCaptureRecoveries = photoCaptureRecoveries.filter(function(item){
    if(item.key !== String(key)) return true;
    if(item.index === index) return false;
    if(item.index > index) item.index--;
    return true;
  });
}

function setPhotoStoreFailure(kind, error){
  photoStoreFailureKind = kind;
  photoStoreLastError = error && error.message ? error.message : "Photo storage failed";
  updateStorageBar();
}

function photoStoreIdle(){
  return photoCaptureIdle();
}

function photoStoreStatus(){
  return {
    pending:photoCapturePendingCount,
    lastError:photoStoreLastError,
    kind:photoStoreFailureKind,
    orphaned:orphanedPhotoIds.slice()
  };
}

function pickPhoto(key){
  photoTarget = key;
  var inp = document.getElementById("filein");
  inp.value = "";
  inp.click();
}

function photoCaptureSummary(batch){
  var total = batch.files.length;
  var added = batch.durableCount;
  if(!added){
    return total === 1 ? "Could not add that photo." : "Could not add those photos.";
  }
  var message = added === 1 ? "Photo added." : added + " photos added.";
  if(added !== total){
    message = added + " of " + total + " photos added.";
  }
  if(batch.failed){
    message += " " + batch.failed + " could not be processed.";
  }
  var notPersisted = batch.added.length - batch.durableCount;
  if(notPersisted){
    message += " " + notPersisted + " could not be added to the survey.";
  }
  if(batch.inlineFallbacks){
    message += " " + batch.inlineFallbacks +
      (batch.inlineFallbacks === 1 ? " is" : " are") +
      " stored in the survey file rather than device storage.";
  }
  if(batch.finalPersistFailed){
    message += " Survey storage is full - export now.";
  }
  return message;
}

function descriptorFromPhotoRecord(record){
  if(!record || !record.blob) throw new Error("Photo storage returned no record");
  var descriptor = {
    id:record.id,
    mime:String(record.mime || "").toLowerCase(),
    bytes:record.bytes,
    width:record.width,
    height:record.height
  };
  if(!isPhotoDescriptor(descriptor)) throw new Error("Photo storage returned an invalid record");
  return descriptor;
}

function persistCaptureItem(batch, item, kind){
  item.index = photoList(batch.key).indexOf(item.source);
  batch.added.push(item);
  var persisted = persistSurvey();
  if(persisted){
    batch.durableCount = batch.added.length;
  } else {
    rememberPhotoCaptureFailure(batch.key,item,kind);
  }
  return persisted;
}

function appendInlineCapture(batch, dataUrl){
  if(!S.photos[batch.key]) S.photos[batch.key] = [];
  var list = photoList(batch.key);
  var item = {index:list.length,source:dataUrl};
  list.push(dataUrl);
  batch.inlineFallbacks++;
  persistCaptureItem(batch,item,"memory-only");
}

function fallBackAfterStoredRecord(batch, descriptor, dataUrl, error){
  var list = photoList(batch.key);
  var index = list.indexOf(descriptor);
  if(index > -1) list.splice(index,1);
  delete missingPhotoIds[descriptor.id];
  rememberOrphanedPhotoId(descriptor.id);
  batch.storageDegraded = true;
  batch.orphans++;
  setPhotoStoreFailure("verify",error);
  if(index < 0 || index > list.length) index = list.length;
  list.splice(index,0,dataUrl);
  batch.inlineFallbacks++;
  persistCaptureItem(batch,{index:index,source:dataUrl},"memory-only");
}

function storeCapturedPhoto(batch, dataUrl, dimensions){
  if(batch.storageDegraded){
    appendInlineCapture(batch,dataUrl);
    return Promise.resolve();
  }
  if(!window.AVLPhotoStore || typeof window.AVLPhotoStore.addDataUrl !== "function"){
    batch.storageDegraded = true;
    setPhotoStoreFailure("add",new Error("Photo storage is unavailable"));
    appendInlineCapture(batch,dataUrl);
    return Promise.resolve();
  }

  var write;
  try {
    write = window.AVLPhotoStore.addDataUrl(
      dataUrl,
      dimensions && dimensions.width,
      dimensions && dimensions.height
    );
  } catch(error){
    write = Promise.reject(error);
  }

  return Promise.resolve(write).then(function(record){
    var descriptor;
    try { descriptor = descriptorFromPhotoRecord(record); }
    catch(error){
      batch.storageDegraded = true;
      batch.orphans++;
      if(record && record.id) rememberOrphanedPhotoId(record.id);
      setPhotoStoreFailure("verify",error);
      appendInlineCapture(batch,dataUrl);
      return;
    }
    if(!S.photos[batch.key]) S.photos[batch.key] = [];
    var list = photoList(batch.key);
    var index = list.length;
    list.push(descriptor);
    return hydratePhotoSource(batch.key,index).then(function(){
      var liveIndex = list.indexOf(descriptor);
      if(liveIndex < 0) throw new Error("Photo changed during storage verification");
      persistCaptureItem(batch,{index:liveIndex,source:descriptor},"unreferenced");
    }).catch(function(error){
      fallBackAfterStoredRecord(batch,descriptor,dataUrl,error);
    });
  },function(error){
    batch.storageDegraded = true;
    setPhotoStoreFailure("add",error);
    appendInlineCapture(batch,dataUrl);
  });
}

function processPhotoBatch(key, files, compressor){
  var batch = {
    key:String(key),
    files:Array.prototype.slice.call(files || []),
    index:0,
    added:[],
    durableCount:0,
    failed:0,
    inlineFallbacks:0,
    storageDegraded:false,
    orphans:0,
    finalPersistFailed:false
  };
  var runCompressor = compressor || compress;
  if(saveTimer){
    clearTimeout(saveTimer);
    saveTimer = null;
    photoCaptureSaveSuppressed = true;
  }
  photoCaptureCritical = true;
  photoCapturePendingCount = batch.files.length;

  function next(){
    if(batch.index >= batch.files.length){
      photoCaptureCritical = false;
      photoCapturePendingCount = 0;
      if(photoCaptureSaveSuppressed){
        photoCaptureSaveSuppressed = false;
        if(batch.added.length){
          if(persistSurvey()){
            batch.durableCount = batch.added.length;
          } else {
            batch.finalPersistFailed = true;
          }
        } else {
          save();
        }
      }
      if(batch.added.length) render();
      toast(photoCaptureSummary(batch));
      return Promise.resolve({
        total:batch.files.length,
        added:batch.durableCount,
        captured:batch.added.length,
        failed:batch.failed,
        inlineFallbacks:batch.inlineFallbacks,
        orphans:batch.orphans,
        persisted:batch.durableCount === batch.added.length
      });
    }

    var file = batch.files[batch.index++];
    return new Promise(function(resolve){
      var settled = false;
      var guard = setTimeout(function(){
        finish(null,true);
      },photoCompressTimeoutMs);
      function finish(value,failed){
        if(settled) return;
        settled = true;
        clearTimeout(guard);
        if(failed) batch.failed++;
        resolve(value);
      }
      try {
        runCompressor(file, function(dataUrl, dimensions){
          if(dataUrl){
            finish({dataUrl:dataUrl,dimensions:dimensions},false);
          } else {
            finish(null,true);
          }
        });
      } catch(error){
        finish(null,true);
      }
    }).then(function(result){
      if(!result) return;
      return storeCapturedPhoto(batch,result.dataUrl,result.dimensions);
    }).then(function(){
      photoCapturePendingCount = Math.max(0,photoCapturePendingCount - 1);
      return next();
    });
  }

  return next().catch(function(error){
    photoCaptureCritical = false;
    photoCapturePendingCount = 0;
    if(photoCaptureSaveSuppressed){
      photoCaptureSaveSuppressed = false;
      save();
    }
    throw error;
  });
}

function queuePhotoBatch(key, files, compressor){
  var run = function(){ return processPhotoBatch(key,files,compressor); };
  /* The shared flight must never latch rejected. A failed batch cannot
     disable every capture that follows it. */
  var result = photoCaptureFlight.then(run,run);
  photoCaptureFlight = result.catch(function(){});
  return result;
}

function photoCaptureIdle(){
  return photoCaptureFlight.then(function(){});
}

document.getElementById("filein").addEventListener("change", function(e){
  var files = Array.prototype.slice.call(e.target.files || []);
  if(!files.length || !photoTarget) return;
  queuePhotoBatch(photoTarget,files);
});

function compress(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 900;
      var scale = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      try {
        cb(c.toDataURL("image/jpeg", 0.62), {width:c.width, height:c.height});
      } catch(err){ cb(null); }
    };
    img.onerror = function(){ cb(null); };
    img.src = reader.result;
  };
  reader.onerror = function(){ cb(null); };
  reader.readAsDataURL(file);
}

function portablePhotoValid(value){
  if(!value || typeof value !== "object" || Array.isArray(value)) return false;
  if(typeof value.mime !== "string" || !value.mime) return false;
  if(typeof value.data !== "string") return false;
  var fields = ["bytes","width","height"];
  for(var i=0;i<fields.length;i++){
    var n = value[fields[i]];
    if(typeof n !== "number" || !isFinite(n) || n < 0 || Math.floor(n) !== n) return false;
  }
  try {
    var decoded = decodeDataUrl(value.data);
    return decoded.mime === value.mime.toLowerCase() && decoded.bytes.length === value.bytes;
  } catch(error){
    return false;
  }
}
function portableImportState(payload, useDescriptors){
  if(!payload || payload.app !== "avl-survey" || payload.schema !== 3 ||
     payload.photoFormat !== "inline" || !payload.data || typeof payload.data !== "object"){
    return Promise.reject(new Error("This file lists photos that are stored on the device it came from. Export again from that device."));
  }
  var sourcePhotos = payload.data.photos || {};
  if(!sourcePhotos || typeof sourcePhotos !== "object" || Array.isArray(sourcePhotos)){
    return Promise.reject(new Error("Portable photo data is malformed"));
  }
  var data = JSON.parse(JSON.stringify({
    visit:payload.data.visit,
    log:payload.data.log,
    rooms:payload.data.rooms,
    photos:{},
    skipped:payload.data.skipped,
    ui:payload.data.ui,
    meta:payload.data.meta
  }));
  var jobs = [];
  var keys = Object.keys(sourcePhotos);
  for(var k=0;k<keys.length;k++){
    var list = sourcePhotos[keys[k]];
    if(!Array.isArray(list)) return Promise.reject(new Error("Portable photo data is malformed"));
    data.photos[keys[k]] = [];
    for(var i=0;i<list.length;i++){
      if(!portablePhotoValid(list[i])){
        return Promise.reject(new Error("Portable photo data is malformed"));
      }
      jobs.push({key:keys[k], value:list[i]});
    }
  }
  var baseValidation = validate(data);
  if(!baseValidation.ok) return Promise.reject(new Error(baseValidation.reason));
  if(!useDescriptors){
    jobs.forEach(function(job){ data.photos[job.key].push(job.value.data); });
    return Promise.resolve(coerce(data));
  }

  var records = [];
  var probeId = "";
  var chain = Promise.resolve();
  function verifyPortableRecord(record,job){
    var descriptor = descriptorFromPhotoRecord(record);
    if(record.blob.size !== descriptor.bytes ||
       descriptor.bytes !== job.value.bytes ||
       descriptor.mime !== job.value.mime.toLowerCase()){
      throw new Error("Photo storage verification failed");
    }
    return record;
  }
  if(jobs.length){
    chain = chain.then(function(){
      if(!window.AVLPhotoStore ||
         typeof window.AVLPhotoStore.addDataUrl !== "function" ||
         typeof window.AVLPhotoStore.get !== "function" ||
         (jobs.length > 1 && typeof window.AVLPhotoStore.addDataUrls !== "function")){
        throw new Error("Photo storage is unavailable");
      }
      return window.AVLPhotoStore.addDataUrl(
        jobs[0].value.data,
        jobs[0].value.width,
        jobs[0].value.height
      );
    }).then(function(record){
      if(record && record.id) probeId = record.id;
      verifyPortableRecord(record,jobs[0]);
      var read;
      try { read = window.AVLPhotoStore.get(probeId); }
      catch(error){ read = Promise.reject(error); }
      return Promise.resolve(read);
    }).then(function(record){
      if(!record || record.id !== probeId) throw new Error("Photo storage verification failed");
      verifyPortableRecord(record,jobs[0]);
      records.push({job:jobs[0],record:record});
      if(jobs.length === 1) return [];
      return window.AVLPhotoStore.addDataUrls(jobs.slice(1).map(function(job){
        return {
          data:job.value.data,
          width:job.value.width,
          height:job.value.height
        };
      }));
    }).then(function(batchRecords){
      if(!Array.isArray(batchRecords) || batchRecords.length !== Math.max(0,jobs.length - 1)){
        throw new Error("Photo storage verification failed");
      }
      batchRecords.forEach(function(record,index){
        records.push({job:jobs[index + 1],record:record});
      });
    });
  }
  return chain.then(function(){
    var seen = {};
    records.forEach(function(item){
      var descriptor = descriptorFromPhotoRecord(verifyPortableRecord(item.record,item.job));
      if(seen[descriptor.id]) throw new Error("Photo storage returned a duplicate id");
      seen[descriptor.id] = true;
      data.photos[item.job.key].push(descriptor);
    });
    var result = validate(data);
    if(!result.ok) throw new Error(result.reason);
    return coerce(data);
  }).catch(function(){
    if(probeId) rememberOrphanedPhotoId(probeId);
    records.forEach(function(item){
      if(item.record && item.record.id) rememberOrphanedPhotoId(item.record.id);
    });
    Object.keys(data.photos).forEach(function(key){ data.photos[key] = []; });
    jobs.forEach(function(job){ data.photos[job.key].push(job.value.data); });
    return coerce(data);
  });
}
function applyPreparedImport(incoming, from){
  var rooms = incoming.rooms.length;
  var hadWork = hasSurveyWork();
  if(hadWork && !snapshot()){
    toast("Could not back up current survey — import cancelled");
    return false;
  }
  revokeAllPhotoAssets();
  photoCaptureRecoveries = [];
  S = incoming;
  reseq();
  save();
  render();
  refreshPhotoIntegrity();
  toast("Imported " + rooms + (rooms === 1 ? " room" : " rooms") +
    (from < SCHEMA ? " (upgraded from v" + from + ")" : "") +
    (hadWork ? " — previous survey backed up" : ""));
  return true;
}
function applyPortableImport(payload, useDescriptors){
  return portableImportState(payload,!!useDescriptors).then(function(incoming){
    return applyPreparedImport(incoming,3);
  }).catch(function(error){
    toast("Not imported: " + (error && error.message ? error.message : "portable import failed"));
    return false;
  });
}

/* Import is the most dangerous operation in the app: it overwrites everything.
   Parse, migrate, validate, snapshot, then apply. */
function applyImport(text){
  var parsed;
  try { parsed = JSON.parse(text); }
  catch(e){ toast("That file isn't valid JSON"); return false; }

  if(parsed && parsed.app === "avl-survey" && parsed.schema === 3){
    if(parsed.photoFormat === "archive"){
      toast("Not imported: This is the survey file from inside a photo package. Its photos are in the photos folder beside it. Use Export data for a file that imports on its own.");
      return false;
    }
    if(parsed.photoFormat !== "inline"){
      toast("Not imported: This file lists photos that are stored on the device it came from. Export again from that device.");
      return false;
    }
    return applyPortableImport(parsed,true);
  }

  var res = migrate(parsed);
  if(!res.ok){ toast("Not imported: " + res.reason); return false; }
  if(stateHasPhotoDescriptors(res.data)){
    toast("Not imported: This file lists photos that are stored on the device it came from. Export again from that device.");
    return false;
  }

  return applyPreparedImport(res.data,res.from);
}

function restoreBackup(){
  var raw = store.get(BACKUP_KEY);
  if(!raw){ toast("No backup available"); return false; }
  var current = JSON.stringify(envelope());
  var parsed;
  try { parsed = JSON.parse(raw); }
  catch(error){ toast("Backup is unreadable"); return false; }
  var restored = migrate(parsed);
  if(!restored.ok){ toast("Backup not restored: " + restored.reason); return false; }
  if(!applyPreparedImport(restored.data,restored.from)) return false;
  store.set(BACKUP_KEY, current);
  render();
  return true;
}

document.getElementById("jsonin").addEventListener("change", function(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){ applyImport(r.result); };
  r.onerror = function(){ toast("Could not read that file"); };
  r.readAsText(f);
  e.target.value = "";
});

function buildPrintNow(){

  if(!S.skipped["log|main"]){
    var logT = tableFor("log", LOGISTICS), logP = printPhotos("log|main");
    if(logT || logP) h += '<h2>Site logistics &amp; access</h2>' + logT + logP;
  }

  S.rooms.forEach(function(r){
    h += '<div class="rm"><h2>' + esc(r.d.name || ("Room " + r.id)) + '</h2>';
    ROOM_SECTIONS.forEach(function(s){
      if(S.skipped[r.id + "|" + s.id]) return;
      if(s.special === "light"){
        var lf = [
          {k:"lt_time",l:"Time of reading"},{k:"lt_sky",l:"Sky"},{k:"lt_shade",l:"Window treatment"},
          {k:"lt_src",l:"Light sources"},{k:"lux_disp",l:"Lux at display wall"},{k:"lux_mid",l:"Lux mid seating"},
          {k:"lux_rear",l:"Lux rear / window wall"},{k:"lux_preset",l:"Estimated lux (no meter)"},
          {k:"disptype",l:"Intended display type"},{k:"scr_diag",l:"Diagonal (in)"},{k:"scr_gain",l:"Screen gain"}
        ];
        var tbl = tableFor(r.id, lf);
        var lp = printPhotos(r.id + "|light");
        if(tbl || lp){
          h += '<h3>Ambient light</h3>' + tbl;
          var tmp = document.createElement("div");
          tmp.innerHTML = calcHTML(r.id);
          var txt = tmp.textContent.replace(/\s+/g," ").trim();
          if(txt && txt.indexOf("Enter a lux reading") === -1) h += '<div class="cal">' + esc(txt) + '</div>';
          h += lp;
        }
      } else {
        var t2 = tableFor(r.id, s.fields);
        var p2 = printPhotos(r.id + "|" + s.id);
        if(t2 || p2) h += '<h3>' + esc(s.title) + '</h3>' + t2 + p2;
      }
    });
    h += '</div>';
  });

  document.getElementById("print").innerHTML = h;
  setTimeout(function(){
    /* Temporary: the generated-PDF writer replaces this print path and names
       the File itself. Until then iOS derives the PDF filename from the title. */
    var oldTitle = document.title;
    document.title = "Preplot \u2014 " + (S.visit.client || "\u2014") +
      " \u2014 " + (S.visit.site || "\u2014") +
      " \u2014 " + (S.visit.date || "\u2014");
    try { window.print(); }
    catch(e){ toast("Printing blocked here — open the file in your browser"); }
    finally { document.title = oldTitle; }
  }, 120);
}
function buildPrint(){
  var manifest;
  try { manifest = photoManifest(); }
  catch(error){ toast("PDF could not be prepared"); return Promise.resolve(false); }
  var chain = Promise.resolve();
  manifest.forEach(function(entry){
    chain = chain.then(function(){
      return hydratePhotoSource(entry.key,entry.bucketIndex);
    });
  });
  return chain.then(function(){
    buildPrintNow();
    return true;
  }).catch(function(error){
    if(error && error.code === "PHOTO_MISSING"){
      toast("PDF cannot be prepared because a photo is missing from device storage");
    } else {
      toast("PDF could not be prepared");
    }
    return false;
  });
}

/* ---- offline service worker ---- */
var swApplyingUpdate = false;
var swUpdateDismissed = false;
var swUpdateCheckRunning = false;
var swUpdateCheckQueued = false;

function showUpdateNotice(reg){
  if(!reg || !reg.waiting || swUpdateDismissed) return;
  if(document.getElementById("swUpdateNotice")) return;

  var host = document.getElementById("systemNotices");
  if(!host) return;

  var bar = document.createElement("div");
  bar.className = "sysnotice";
  bar.id = "swUpdateNotice";
  bar.setAttribute("role","status");

  var msg = document.createElement("span");
  msg.className = "msg";
  msg.innerHTML = "<b>Update ready.</b> Apply it now or keep working and update later.";

  var later = document.createElement("button");
  later.type = "button";
  later.id = "swUpdateLater";
  later.textContent = "Later";
  later.onclick = function(){
    swUpdateDismissed = true;
    if(bar.parentNode) bar.parentNode.removeChild(bar);
  };

  var apply = document.createElement("button");
  apply.type = "button";
  apply.className = "pri";
  apply.id = "swUpdateNow";
  apply.textContent = "Update";
  apply.onclick = function(){
    if(!reg.waiting) return;
    swApplyingUpdate = true;
    apply.disabled = true;
    later.disabled = true;
    apply.textContent = "Updating...";
    reg.waiting.postMessage({type:"SKIP_WAITING"});
  };

  bar.appendChild(msg);
  bar.appendChild(later);
  bar.appendChild(apply);
  host.appendChild(bar);
}

function watchForUpdate(reg){
  if(reg.waiting) showUpdateNotice(reg);
  reg.addEventListener("updatefound", function(){
    var worker = reg.installing;
    if(!worker) return;
    worker.addEventListener("statechange", function(){
      if(worker.state === "installed" && navigator.serviceWorker.controller){
        showUpdateNotice(reg);
      }
    });
  });
}

function checkForUpdate(reg){
  if(swUpdateCheckRunning){
    swUpdateCheckQueued = true;
    return Promise.resolve();
  }

  swUpdateCheckRunning = true;
  return reg.update()
    .catch(function(){ /* update check unavailable — cached app still works */ })
    .then(function(){
      swUpdateCheckRunning = false;
      if(swUpdateCheckQueued){
        swUpdateCheckQueued = false;
        return checkForUpdate(reg);
      }
    });
}

if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(!swApplyingUpdate) return;
    swApplyingUpdate = false;
    window.location.reload();
  });

  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js", {updateViaCache:"none"}).then(function(reg){
      watchForUpdate(reg);
      window.addEventListener("focus", function(){ checkForUpdate(reg); });
      document.addEventListener("visibilitychange", function(){
        if(document.visibilityState === "visible"){
          checkForUpdate(reg);
          refreshStorageEstimate();
        }
      });
      checkForUpdate(reg).then(function(){
        if(window.__avl) window.__avl.swReady = true;
      });
    }).catch(function(){ /* offline caching unavailable — app still runs */ });
  });
}

/* ---- add-to-home-screen hint (iOS gives no install prompt API) ---- */
(function(){
  var standalone = window.navigator.standalone === true ||
                   (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  if(standalone) return;
  if(store.get("avl_hint_dismissed") === "1") return;
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  var bar = document.createElement("div");
  bar.className = "sysnotice";
  bar.innerHTML = '<span class="msg">' +
    (isIOS
      ? 'Install for offline use: tap <b>Share</b>, then <b>Add to Home Screen</b>.'
      : 'Install for offline use: open the browser menu and choose <b>Add to Home screen</b>.') +
    '</span>';
  var x = document.createElement("button");
  x.textContent = "Got it";
  x.onclick = function(){
    store.set("avl_hint_dismissed","1");
    if(bar.parentNode) bar.parentNode.removeChild(bar);
  };
  bar.appendChild(x);
  setTimeout(function(){
    var host = document.getElementById("systemNotices");
    if(host) host.appendChild(bar);
  }, 900);
})();

    var result = validate(data);
    if(!result.ok) return Promise.reject(new Error(result.reason));
    revokeAllPhotoAssets();
    photoCaptureRecoveries = [];
    S = coerce(data);
    reseq();
    render();
    return refreshPhotoIntegrity();
  },
  swReady:false
};
